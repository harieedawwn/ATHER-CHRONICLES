<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER CLASH — Anime Pixel Platform Fighter</title>
  <style>
    /* Reset & Crisp Pixel Rendering Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #07090f;
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111625 0%, #05070c 100%);
    }

    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background-color: #090d1a;
    }

    /* Minimalist floating mute toggle in top-right corner */
    #audio-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    #audio-btn:hover {
      background: rgba(30, 41, 59, 0.96);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <button id="audio-btn" title="Toggle Audio (M)">[M] SFX: ON</button>
  </div>

  <script>
    /**
     * ============================================================================
     * AETHER CLASH — High-Density Pixel-Art Anime Platform Fighter (800x450)
     *
     * Architecture & Hardened Systems:
     * 1. Crisp 800x450 Internal Pixel Buffer (imageSmoothingEnabled = false)
     * 2. Explicit Fighter Lifecycle State Machine ('active' | 'dead' | 'respawning'):
     *    - Strict checkBlastZones(f) guard (only runs when f.state === 'active')
     *    - Atomic triggerKO(victim, attacker) & clearMutualCombatState(p1, p2)
     *    - 48-frame blast pillar -> 95-frame hovering respawn halo at (400, 92)
     *      with 160-frame invulnerability shimmer & Verlet cloth reset
     *    - 'ko_finish' (50-frame dramatic finish) -> 'gameover' results screen
     * 3. Studio-Mastered Cinematic Web Audio Foley Engine:
     *    - Stereo ConvolverNode Reverb + DynamicsCompressorNode + WaveShaperNode
     *    - Master BiquadFilterNode low-pass sweep (20000Hz -> 360Hz in time-dilation)
     *    - All ramps clamped to >= 0.0001 and wrapped in try/catch
     * 4. Multi-Joint Articulated Stickman Rig + Verlet Cloth Trails +
     *    Multi-Phase Keyframes (windup, active smear, follow-through, recovery)
     * ============================================================================
     */

    (() => {
      'use strict';

      // -------------------------------------------------------------------------
      // 1. CANVAS & CRISP 800x450 PIXEL BUFFER SETUP
      // -------------------------------------------------------------------------
      const INTERNAL_W = 800;
      const INTERNAL_H = 450;

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      canvas.width = INTERNAL_W;
      canvas.height = INTERNAL_H;

      function resizeCanvas() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const targetAspect = INTERNAL_W / INTERNAL_H;
        const windowAspect = vw / vh;

        let renderW, renderH;
        if (windowAspect > targetAspect) {
          renderH = vh;
          renderW = Math.floor(vh * targetAspect);
        } else {
          renderW = vw;
          renderH = Math.floor(vw / targetAspect);
        }

        canvas.style.width = `${Math.max(1, renderW)}px`;
        canvas.style.height = `${Math.max(1, renderH)}px`;
        ctx.imageSmoothingEnabled = false;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // -------------------------------------------------------------------------
      // 2. SAFE MATH & CRISP PIXEL PRIMITIVES
      // -------------------------------------------------------------------------
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const safeHypot = (dx, dy) => Math.max(0.0001, Math.hypot(dx || 0, dy || 0));
      const dist = (x1, y1, x2, y2) => Math.hypot((x2 || 0) - (x1 || 0), (y2 || 0) - (y1 || 0));
      const randRange = (min, max) => min + Math.random() * (max - min);

      function fillPixelCircle(ctx, cx, cy, r, color) {
        if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
        ctx.fillStyle = color;
        const ix = Math.round(cx);
        const iy = Math.round(cy);
        const ir = Math.max(1, Math.round(r));
        for (let dy = -ir; dy <= ir; dy++) {
          const span = Math.floor(Math.sqrt(ir * ir - dy * dy));
          ctx.fillRect(ix - span, iy + dy, span * 2 + 1, 1);
        }
      }

      function strokePixelCircle(ctx, cx, cy, r, color, thickness = 1) {
        if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
        ctx.fillStyle = color;
        const ix = Math.round(cx);
        const iy = Math.round(cy);
        const rOuter = Math.max(1, Math.round(r));
        const rInner = Math.max(0, rOuter - thickness);
        for (let dy = -rOuter; dy <= rOuter; dy++) {
          const outerSpan = Math.floor(Math.sqrt(rOuter * rOuter - dy * dy));
          if (Math.abs(dy) > rInner) {
            ctx.fillRect(ix - outerSpan, iy + dy, outerSpan * 2 + 1, 1);
          } else {
            const innerSpan = Math.floor(Math.sqrt(rInner * rInner - dy * dy));
            const w = outerSpan - innerSpan;
            if (w > 0) {
              ctx.fillRect(ix - outerSpan, iy + dy, w, 1);
              ctx.fillRect(ix + innerSpan + 1, iy + dy, w, 1);
            }
          }
        }
      }

      function drawPixelLimb(ctx, x1, y1, x2, y2, thickness, color) {
        if (!Number.isFinite(x1) || !Number.isFinite(y1) || !Number.isFinite(x2) || !Number.isFinite(y2)) return;
        ctx.fillStyle = color;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const steps = Math.min(240, Math.max(Math.abs(dx), Math.abs(dy), 1));
        const half = Math.floor(thickness / 2);
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const px = Math.round(x1 + dx * t) - half;
          const py = Math.round(y1 + dy * t) - half;
          ctx.fillRect(px, py, thickness, thickness);
        }
      }

      // -------------------------------------------------------------------------
      // 3. CINEMATIC FILM / ANIME WEB AUDIO FOLEY ENGINE (100% TRY/CATCH GUARDED)
      // -------------------------------------------------------------------------
      class CinematicAudioEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.masterGain = null;
          this.masterFilter = null;
          this.compressor = null;
          this.reverbNode = null;
          this.reverbGain = null;
          this.shaper = null;
          this.pinkNoiseBuffer = null;
          this.brownNoiseBuffer = null;
          this.droneOsc = null;
          this.droneGain = null;
          this.isDucked = false;
        }

        init() {
          try {
            if (this.ctx) {
              if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
              }
              return;
            }

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            this.ctx = new AudioCtx();
            const sr = this.ctx.sampleRate;

            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.value = -14;
            this.compressor.knee.value = 18;
            this.compressor.ratio.value = 5;
            this.compressor.attack.value = 0.004;
            this.compressor.release.value = 0.16;

            this.masterFilter = this.ctx.createBiquadFilter();
            this.masterFilter.type = 'lowpass';
            this.masterFilter.frequency.value = 20000;
            this.masterFilter.Q.value = 0.85;

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.enabled ? 0.85 : 0.0001;

            // Stereo Arena Impulse Response
            const revLen = Math.floor(sr * 1.4);
            const revBuf = this.ctx.createBuffer(2, revLen, sr);
            for (let ch = 0; ch < 2; ch++) {
              const data = revBuf.getChannelData(ch);
              for (let i = 0; i < revLen; i++) {
                const t = i / revLen;
                const env = Math.pow(1 - t, 2.6);
                data[i] = (Math.random() * 2 - 1) * env * (i < sr * 0.04 ? 0.75 : 0.45);
              }
            }
            this.reverbNode = this.ctx.createConvolver();
            this.reverbNode.buffer = revBuf;

            this.reverbGain = this.ctx.createGain();
            this.reverbGain.gain.value = 0.28;

            this.masterFilter.connect(this.compressor);
            this.reverbNode.connect(this.reverbGain);
            this.reverbGain.connect(this.compressor);
            this.compressor.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);

            this.shaper = this.ctx.createWaveShaper();
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
              const x = (i * 2) / 256 - 1;
              curve[i] = Math.tanh(x * 2.4);
            }
            this.shaper.curve = curve;
            this.shaper.oversample = '2x';

            const noiseLen = sr * 2;
            this.pinkNoiseBuffer = this.ctx.createBuffer(1, noiseLen, sr);
            this.brownNoiseBuffer = this.ctx.createBuffer(1, noiseLen, sr);
            const pink = this.pinkNoiseBuffer.getChannelData(0);
            const brown = this.brownNoiseBuffer.getChannelData(0);

            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            let lastOut = 0;
            for (let i = 0; i < noiseLen; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              pink[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.06;
              b6 = white * 0.115926;

              lastOut = (lastOut + 0.025 * white) / 1.025;
              brown[i] = lastOut * 2.8;
            }
          } catch (_) {}
        }

        toggle() {
          this.enabled = !this.enabled;
          const btn = document.getElementById('audio-btn');
          if (btn) btn.textContent = this.enabled ? '[M] SFX: ON' : '[M] SFX: OFF';
          try {
            if (this.ctx && this.masterGain) {
              this.masterGain.gain.setTargetAtTime(this.enabled ? 0.85 : 0.0001, this.ctx.currentTime, 0.02);
            }
          } catch (_) {}
          if (this.enabled) {
            this.init();
            this.playUiSelect();
          }
        }

        startAtmosphericBed() {
          if (!this.enabled) return;
          this.init();
          try {
            if (!this.ctx || this.droneOsc) return;
            const now = this.ctx.currentTime;
            this.droneOsc = this.ctx.createOscillator();
            this.droneOsc.type = 'sine';
            this.droneOsc.frequency.setValueAtTime(55, now);

            this.droneGain = this.ctx.createGain();
            this.droneGain.gain.setValueAtTime(0.001, now);
            this.droneGain.gain.linearRampToValueAtTime(0.03, now + 1.2);

            this.droneOsc.connect(this.droneGain);
            this.droneGain.connect(this.masterFilter);
            this.droneOsc.start(now);
          } catch (_) {}
        }

        stopAtmosphericBed() {
          try {
            if (this.droneOsc && this.ctx) {
              const now = this.ctx.currentTime;
              this.droneGain.gain.setTargetAtTime(0.0001, now, 0.15);
              this.droneOsc.stop(now + 0.5);
            }
          } catch (_) {}
          this.droneOsc = null;
          this.droneGain = null;
        }

        setTimeDilationDuck(active) {
          try {
            if (!this.ctx || !this.masterFilter) return;
            const now = this.ctx.currentTime;
            if (active && !this.isDucked) {
              this.isDucked = true;
              this.masterFilter.frequency.cancelScheduledValues(now);
              this.masterFilter.frequency.setTargetAtTime(360, now, 0.035);
              this.playHeartbeatPulse();
            } else if (!active && this.isDucked) {
              this.isDucked = false;
              this.masterFilter.frequency.cancelScheduledValues(now);
              this.masterFilter.frequency.setTargetAtTime(20000, now, 0.04);
            }
          } catch (_) {}
        }

        playHeartbeatPulse() {
          if (!this.enabled || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            [0, 0.16].forEach((offset, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              const f0 = idx === 0 ? 68 : 60;
              osc.frequency.setValueAtTime(Math.max(0.0001, f0), now + offset);
              osc.frequency.exponentialRampToValueAtTime(Math.max(0.0001, 28), now + offset + 0.14);

              gain.gain.setValueAtTime(Math.max(0.0001, 0.24), now + offset);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);

              osc.connect(gain);
              gain.connect(this.compressor);
              osc.start(now + offset);
              osc.stop(now + offset + 0.16);
            });
          } catch (_) {}
        }

        playNoiseSweep(buffer, fStart, fPeak, fEnd, qVal, duration, gainVal, reverbSend = 0.2, delay = 0) {
          if (!this.enabled) return;
          this.init();
          try {
            if (!this.ctx || !buffer) return;
            const dur = Math.max(0.02, duration);
            const now = this.ctx.currentTime + Math.max(0, delay);
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            src.loop = true;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.Q.setValueAtTime(Math.max(0.1, qVal), now);
            filter.frequency.setValueAtTime(Math.max(20, fStart), now);
            filter.frequency.exponentialRampToValueAtTime(Math.max(20, fPeak), now + dur * 0.35);
            filter.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), now + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(Math.max(0.0002, gainVal), now + dur * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

            src.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterFilter);
            if (reverbSend > 0) {
              const wet = this.ctx.createGain();
              wet.gain.value = reverbSend;
              gain.connect(wet);
              wet.connect(this.reverbNode);
            }

            src.start(now, Math.random() * 1.0, dur + 0.02);
          } catch (_) {}
        }

        playSubDrop(fStart, fEnd, duration, gainVal, saturate = false, reverbSend = 0.25, delay = 0) {
          if (!this.enabled) return;
          this.init();
          try {
            if (!this.ctx) return;
            const dur = Math.max(0.02, duration);
            const now = this.ctx.currentTime + Math.max(0, delay);
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(Math.max(20, fStart), now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), now + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(Math.max(0.0002, gainVal), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

            if (saturate && this.shaper) {
              osc.connect(this.shaper);
              this.shaper.connect(gain);
            } else {
              osc.connect(gain);
            }

            gain.connect(this.masterFilter);
            if (reverbSend > 0) {
              const wet = this.ctx.createGain();
              wet.gain.value = reverbSend;
              gain.connect(wet);
              wet.connect(this.reverbNode);
            }

            osc.start(now);
            osc.stop(now + dur + 0.02);
          } catch (_) {}
        }

        playUiMove() {
          this.playNoiseSweep(this.pinkNoiseBuffer, 900, 1400, 700, 3.5, 0.045, 0.09, 0.15);
        }

        playUiSelect() {
          this.playSubDrop(220, 330, 0.16, 0.08, false, 0.35);
          this.playNoiseSweep(this.pinkNoiseBuffer, 600, 1800, 900, 2.2, 0.16, 0.11, 0.3);
        }

        playJump(isDouble = false) {
          if (isDouble) {
            this.playNoiseSweep(this.pinkNoiseBuffer, 280, 1150, 420, 1.8, 0.18, 0.22, 0.25);
            this.playSubDrop(130, 65, 0.14, 0.11, false, 0.2);
          } else {
            this.playNoiseSweep(this.brownNoiseBuffer, 220, 760, 310, 1.4, 0.13, 0.18, 0.15);
          }
        }

        playDash() {
          this.playNoiseSweep(this.pinkNoiseBuffer, 340, 1450, 380, 2.1, 0.16, 0.22, 0.22);
        }

        playSwing(heavy = false, weaponType = 'gauntlets') {
          if (weaponType === 'katana' || weaponType === 'daggers' || weaponType === 'astral') {
            this.playMetallicSlash(heavy, weaponType);
            return;
          }
          if (heavy) {
            this.playNoiseSweep(this.brownNoiseBuffer, 180, 560, 140, 1.2, 0.24, 0.28, 0.25);
            this.playSubDrop(105, 38, 0.18, 0.14, true, 0.2);
          } else {
            this.playNoiseSweep(this.pinkNoiseBuffer, 420, 1280, 360, 1.6, 0.11, 0.18, 0.15);
          }
        }

        playMetallicSlash(heavy = false, weaponType = 'katana') {
          if (!this.enabled) return;
          this.init();
          this.playNoiseSweep(
            this.pinkNoiseBuffer,
            heavy ? 650 : 950,
            heavy ? 2800 : 3400,
            750,
            2.6,
            heavy ? 0.22 : 0.13,
            heavy ? 0.24 : 0.17,
            0.3
          );
          try {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const dur = heavy ? 0.26 : 0.15;
            const baseFreq = weaponType === 'astral' ? 2150 : weaponType === 'daggers' ? 2650 : 1880;
            [1, 1.52, 2.18].forEach((mult, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = idx === 0 ? 'triangle' : 'sine';
              const f = baseFreq * mult;
              osc.frequency.setValueAtTime(Math.max(20, f * 1.04), now);
              osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * 0.96), now + dur);

              const amp = (heavy ? 0.045 : 0.03) / (idx + 1);
              gain.gain.setValueAtTime(Math.max(0.0002, amp), now);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

              osc.connect(gain);
              gain.connect(this.masterFilter);
              gain.connect(this.reverbNode);
              osc.start(now);
              osc.stop(now + dur + 0.02);
            });
          } catch (_) {}
        }

        playHit(power = 1) {
          if (power === 1) {
            this.playSubDrop(108, 36, 0.12, 0.22, false, 0.18);
            this.playNoiseSweep(this.brownNoiseBuffer, 450, 920, 260, 1.5, 0.09, 0.22, 0.15);
          } else if (power === 2) {
            this.playSubDrop(118, 28, 0.22, 0.32, true, 0.32);
            this.playNoiseSweep(this.pinkNoiseBuffer, 320, 1100, 220, 1.3, 0.16, 0.28, 0.28);
          } else {
            this.playSubDrop(110, 28, 0.42, 0.44, true, 0.48);
            this.playNoiseSweep(this.brownNoiseBuffer, 160, 680, 120, 1.0, 0.32, 0.36, 0.42);
            this.playNoiseSweep(this.pinkNoiseBuffer, 1200, 2400, 520, 2.2, 0.18, 0.18, 0.35);
          }
        }

        playVanish() {
          this.playSubDrop(240, 48, 0.16, 0.22, false, 0.35);
          this.playNoiseSweep(this.pinkNoiseBuffer, 1800, 3200, 480, 2.4, 0.14, 0.24, 0.35);
        }

        playVanishCharge() {
          this.playNoiseSweep(this.pinkNoiseBuffer, 260, 920, 1450, 2.8, 0.36, 0.2, 0.38);
          this.playSubDrop(52, 88, 0.36, 0.16, false, 0.3);
        }

        playHakiTrigger() {
          this.playSubDrop(165, 34, 0.38, 0.26, false, 0.45);
          this.playNoiseSweep(this.pinkNoiseBuffer, 1400, 520, 280, 3.2, 0.34, 0.18, 0.42);
          this.playHeartbeatPulse();
        }

        playOverdrive() {
          this.playSubDrop(130, 32, 0.28, 0.28, true, 0.38);
          this.playNoiseSweep(this.pinkNoiseBuffer, 320, 2200, 640, 2.0, 0.28, 0.26, 0.36);
        }

        playLightning() {
          this.playSubDrop(98, 28, 0.3, 0.32, true, 0.42);
          this.playNoiseSweep(this.pinkNoiseBuffer, 1600, 3800, 900, 3.0, 0.22, 0.26, 0.35);
        }

        playAstralWarp() {
          this.playNoiseSweep(this.pinkNoiseBuffer, 900, 2600, 620, 3.4, 0.2, 0.2, 0.4);
          this.playSubDrop(180, 44, 0.2, 0.18, false, 0.35);
        }

        playRespawnHalo() {
          this.playNoiseSweep(this.pinkNoiseBuffer, 1200, 640, 360, 2.6, 0.28, 0.14, 0.38);
          this.playSubDrop(150, 55, 0.26, 0.12, false, 0.32);
        }

        playKO() {
          this.playSubDrop(110, 26, 0.68, 0.5, true, 0.6);
          this.playNoiseSweep(this.brownNoiseBuffer, 140, 620, 95, 0.9, 0.58, 0.42, 0.55);
          this.playNoiseSweep(this.pinkNoiseBuffer, 900, 2200, 340, 1.8, 0.35, 0.24, 0.5);
        }
      }

      const sfx = new CinematicAudioEngine();
      document.getElementById('audio-btn').addEventListener('click', () => sfx.toggle());

      // -------------------------------------------------------------------------
      // 4. INPUT SYSTEM WITH 7-FRAME ACTION BUFFER & 1P/2P SUPPORT
      // -------------------------------------------------------------------------
      class InputController {
        constructor() {
          this.keys = {};
          this.justPressed = {};
          this.buffers = [[], []];
          this.tapTimers = [
            { left: 0, right: 0, down: 0 },
            { left: 0, right: 0, down: 0 }
          ];
          this.doubleTapped = [
            { left: false, right: false, down: false },
            { left: false, right: false, down: false }
          ];

          window.addEventListener('keydown', (e) => {
            const code = e.code;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) {
              e.preventDefault();
            }
            sfx.init();

            if (!this.keys[code]) {
              this.justPressed[code] = true;
              this.handleKeyDown(code);
            }
            this.keys[code] = true;
          });

          window.addEventListener('keyup', (e) => {
            this.keys[e.code] = false;
          });

          window.addEventListener('blur', () => {
            this.keys = {};
          });
        }

        handleKeyDown(code) {
          if (code === 'KeyM') {
            sfx.toggle();
            return;
          }

          const is2P = gameState.mode === '2P';

          if (code === 'KeyA' || (!is2P && code === 'ArrowLeft')) {
            if (this.tapTimers[0].left > 0) this.doubleTapped[0].left = true;
            this.tapTimers[0].left = 14;
          }
          if (code === 'KeyD' || (!is2P && code === 'ArrowRight')) {
            if (this.tapTimers[0].right > 0) this.doubleTapped[0].right = true;
            this.tapTimers[0].right = 14;
          }
          if (code === 'KeyS' || (!is2P && code === 'ArrowDown')) {
            if (this.tapTimers[0].down > 0) this.doubleTapped[0].down = true;
            this.tapTimers[0].down = 14;
          }

          const dir0 = this.getDirection(0);
          if (code === 'Space') {
            this.pushBuffer(0, 'jump', dir0);
          } else if (code === 'KeyC') {
            this.pushBuffer(0, 'shorthop', dir0);
          } else if ((!is2P && code === 'KeyK') || (is2P && code === 'KeyF')) {
            this.pushBuffer(0, 'light', dir0);
          } else if ((!is2P && code === 'KeyL') || (is2P && code === 'KeyG')) {
            this.pushBuffer(0, 'strong', dir0);
          } else if ((!is2P && code === 'KeyJ') || (is2P && code === 'KeyH')) {
            this.pushBuffer(0, 'special', dir0);
          } else if ((!is2P && (code === 'KeyV' || code === 'ShiftLeft' || code === 'ShiftRight')) || (is2P && code === 'KeyR')) {
            this.pushBuffer(0, 'dodge', dir0);
          }

          if (is2P) {
            if (code === 'ArrowLeft') {
              if (this.tapTimers[1].left > 0) this.doubleTapped[1].left = true;
              this.tapTimers[1].left = 14;
            }
            if (code === 'ArrowRight') {
              if (this.tapTimers[1].right > 0) this.doubleTapped[1].right = true;
              this.tapTimers[1].right = 14;
            }
            if (code === 'ArrowDown') {
              if (this.tapTimers[1].down > 0) this.doubleTapped[1].down = true;
              this.tapTimers[1].down = 14;
            }

            const dir1 = this.getDirection(1);
            if (code === 'ShiftRight' || code === 'Numpad0') {
              this.pushBuffer(1, 'jump', dir1);
            } else if (code === 'Slash' || code === 'Period') {
              this.pushBuffer(1, 'shorthop', dir1);
            } else if (code === 'KeyJ' || code === 'Numpad1') {
              this.pushBuffer(1, 'light', dir1);
            } else if (code === 'KeyK' || code === 'Numpad2') {
              this.pushBuffer(1, 'strong', dir1);
            } else if (code === 'KeyL' || code === 'Numpad3') {
              this.pushBuffer(1, 'special', dir1);
            } else if (code === 'Semicolon' || code === 'Enter') {
              this.pushBuffer(1, 'dodge', dir1);
            }
          }
        }

        pushBuffer(slot, action, dir) {
          this.buffers[slot].push({ action, dir, timer: 7 });
        }

        consumeBuffer(slot = 0, actionFilter = null) {
          const buf = this.buffers[slot];
          for (let i = 0; i < buf.length; i++) {
            if (!actionFilter || actionFilter.includes(buf[i].action)) {
              const item = buf[i];
              buf.splice(i, 1);
              return item;
            }
          }
          return null;
        }

        peekBuffer(slot = 0, actionFilter = null) {
          const buf = this.buffers[slot];
          for (let i = 0; i < buf.length; i++) {
            if (!actionFilter || actionFilter.includes(buf[i].action)) {
              return buf[i];
            }
          }
          return null;
        }

        clearBuffers(slot = 0) {
          this.buffers[slot] = [];
        }

        update() {
          for (let s = 0; s < 2; s++) {
            for (const k in this.tapTimers[s]) {
              if (this.tapTimers[s][k] > 0) this.tapTimers[s][k]--;
            }
            const buf = this.buffers[s];
            for (let i = buf.length - 1; i >= 0; i--) {
              buf[i].timer--;
              if (buf[i].timer <= 0) {
                buf.splice(i, 1);
              }
            }
          }
        }

        clearFrameFlags() {
          this.justPressed = {};
          for (let s = 0; s < 2; s++) {
            this.doubleTapped[s].left = false;
            this.doubleTapped[s].right = false;
            this.doubleTapped[s].down = false;
          }
        }

        isHeld(code) {
          return !!this.keys[code];
        }

        getAxisX(slot = 0) {
          const is2P = gameState.mode === '2P';
          if (slot === 0) {
            const l = this.isHeld('KeyA') || (!is2P && this.isHeld('ArrowLeft')) ? -1 : 0;
            const r = this.isHeld('KeyD') || (!is2P && this.isHeld('ArrowRight')) ? 1 : 0;
            return l + r;
          } else {
            const l = this.isHeld('ArrowLeft') ? -1 : 0;
            const r = this.isHeld('ArrowRight') ? 1 : 0;
            return l + r;
          }
        }

        getAxisY(slot = 0) {
          const is2P = gameState.mode === '2P';
          if (slot === 0) {
            const u = this.isHeld('KeyW') || (!is2P && this.isHeld('ArrowUp')) ? -1 : 0;
            const d = this.isHeld('KeyS') || (!is2P && this.isHeld('ArrowDown')) ? 1 : 0;
            return u + d;
          } else {
            const u = this.isHeld('ArrowUp') ? -1 : 0;
            const d = this.isHeld('ArrowDown') ? 1 : 0;
            return u + d;
          }
        }

        isHoldingStrong(slot = 0) {
          const is2P = gameState.mode === '2P';
          if (slot === 0) {
            return !is2P ? this.isHeld('KeyL') : this.isHeld('KeyG');
          }
          return this.isHeld('KeyK') || this.isHeld('Numpad2');
        }

        getDirection(slot = 0) {
          const x = this.getAxisX(slot);
          const y = this.getAxisY(slot);
          if (y < 0 && Math.abs(y) >= Math.abs(x)) return 'up';
          if (y > 0 && Math.abs(y) >= Math.abs(x)) return 'down';
          if (x < 0) return 'left';
          if (x > 0) return 'right';
          return 'neutral';
        }
      }

      // -------------------------------------------------------------------------
      // 7. VISUAL EFFECTS SYSTEM (Particles, Smear Arcs, KO Pillars, Time Dilation)
      // -------------------------------------------------------------------------
      class VFXManager {
        constructor() {
          this.particles = [];
          this.shockwaves = [];
          this.slashes = [];
          this.beams = [];
          this.floatingTexts = [];
          this.impactFrames = 0;
          this.impactColor = '#ffffff';
          this.timeDilation = 1.0;
          this.timeDilationTimer = 0;
        }

        reset() {
          this.particles = [];
          this.shockwaves = [];
          this.slashes = [];
          this.beams = [];
          this.floatingTexts = [];
          this.impactFrames = 0;
          this.timeDilation = 1.0;
          this.timeDilationTimer = 0;
          sfx.setTimeDilationDuck(false);
        }

        triggerImpactFrame(frames = 3, color = '#ffffff') {
          this.impactFrames = Math.max(this.impactFrames, frames);
          this.impactColor = color;
        }

        triggerTimeDilation(scale = 0.25, frames = 22) {
          this.timeDilation = scale;
          this.timeDilationTimer = frames;
          sfx.setTimeDilationDuck(true);
        }

        clearTimeDilation() {
          this.timeDilation = 1.0;
          this.timeDilationTimer = 0;
          sfx.setTimeDilationDuck(false);
        }

        spawnHitSparks(x, y, angle, color, count = 14, speedMult = 1) {
          for (let i = 0; i < count; i++) {
            const spread = randRange(-0.78, 0.78);
            const spd = randRange(2.5, 9.8) * speedMult;
            this.particles.push({
              x,
              y,
              vx: Math.cos(angle + spread) * spd,
              vy: Math.sin(angle + spread) * spd,
              life: randRange(10, 22),
              maxLife: 22,
              size: Math.random() < 0.4 ? 3 : 2,
              color: i % 3 === 0 ? '#ffffff' : color,
              gravity: 0.12,
              streak: true
            });
          }
        }

        spawnDust(x, y, dir = 0, color = '#cbd5e1', count = 6) {
          for (let i = 0; i < count; i++) {
            this.particles.push({
              x: x + randRange(-8, 8),
              y: y + randRange(-3, 1),
              vx: dir * randRange(0.5, 2.2) + randRange(-1.4, 1.4),
              vy: randRange(-1.8, -0.3),
              life: randRange(12, 20),
              maxLife: 20,
              size: Math.random() < 0.5 ? 3 : 2,
              color,
              gravity: -0.02,
              streak: false
            });
          }
        }

        spawnShockwave(x, y, maxR, color, thickness = 2, duration = 16) {
          this.shockwaves.push({
            x,
            y,
            r: 4,
            maxR,
            color,
            thickness,
            life: duration,
            maxLife: duration
          });
        }

        spawnSlashArc(x, y, radius, startAngle, endAngle, color, thickness = 7, duration = 9) {
          this.slashes.push({
            x,
            y,
            radius,
            startAngle,
            endAngle,
            color,
            thickness,
            life: duration,
            maxLife: duration
          });
        }

        spawnKOBeam(x, y, color) {
          const clampedX = clamp(x, 40, 760);
          const clampedY = clamp(y, 40, 410);
          const angle = Math.atan2(225 - clampedY, 400 - clampedX);
          this.beams.push({
            x: clampedX,
            y: clampedY,
            angle,
            life: 46,
            maxLife: 46,
            color
          });
          this.spawnHitSparks(clampedX, clampedY, angle, color, 40, 1.85);
          this.spawnShockwave(clampedX, clampedY, 145, '#ffffff', 4, 28);
          this.spawnShockwave(clampedX, clampedY, 105, color, 3, 24);
        }

        spawnFloatingText(x, y, text, color = '#ffffff') {
          this.floatingTexts.push({
            x,
            y,
            vy: -1.1,
            text,
            color,
            life: 38,
            maxLife: 38
          });
        }

        update() {
          if (this.impactFrames > 0) this.impactFrames--;
          if (this.timeDilationTimer > 0) {
            this.timeDilationTimer--;
            if (this.timeDilationTimer <= 0) {
              this.clearTimeDilation();
            }
          }

          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= 0.94;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
          }

          for (let i = this.shockwaves.length - 1; i >= 0; i--) {
            const s = this.shockwaves[i];
            s.life--;
            const progress = 1 - s.life / Math.max(1, s.maxLife);
            const eased = 1 - Math.pow(1 - progress, 3);
            s.r = 4 + (s.maxR - 4) * eased;
            if (s.life <= 0) this.shockwaves.splice(i, 1);
          }

          for (let i = this.slashes.length - 1; i >= 0; i--) {
            this.slashes[i].life--;
            if (this.slashes[i].life <= 0) this.slashes.splice(i, 1);
          }

          for (let i = this.beams.length - 1; i >= 0; i--) {
            this.beams[i].life--;
            if (this.beams[i].life <= 0) this.beams.splice(i, 1);
          }

          for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.y += ft.vy;
            ft.vy *= 0.94;
            ft.life--;
            if (ft.life <= 0) this.floatingTexts.splice(i, 1);
          }
        }

        renderFront(ctx) {
          for (const sl of this.slashes) {
            const ratio = sl.life / Math.max(1, sl.maxLife);
            ctx.save();
            ctx.globalAlpha = clamp(ratio * 1.25, 0, 1);
            const steps = 26;
            for (let i = 0; i < steps; i++) {
              const t = i / steps;
              const ang = lerp(sl.startAngle, sl.endAngle, t);
              const taper = Math.sin(t * Math.PI);
              const thick = Math.max(1, Math.round(sl.thickness * taper * ratio));
              const px = Math.round(sl.x + Math.cos(ang) * sl.radius);
              const py = Math.round(sl.y + Math.sin(ang) * sl.radius);
              ctx.fillStyle = taper > 0.62 ? '#ffffff' : sl.color;
              ctx.fillRect(px - Math.floor(thick / 2), py - Math.floor(thick / 2), thick, thick);
            }
            ctx.restore();
          }

          for (const sw of this.shockwaves) {
            const ratio = sw.life / Math.max(1, sw.maxLife);
            ctx.save();
            ctx.globalAlpha = ratio;
            strokePixelCircle(ctx, sw.x, sw.y, sw.r, sw.color, Math.max(1, Math.round(sw.thickness * ratio)));
            ctx.restore();
          }

          for (const p of this.particles) {
            const ratio = p.life / Math.max(1, p.maxLife);
            ctx.save();
            ctx.globalAlpha = clamp(ratio * 1.3, 0, 1);
            if (p.streak) {
              drawPixelLimb(ctx, p.x, p.y, p.x - p.vx * 1.9, p.y - p.vy * 1.9, p.size, p.color);
            } else {
              ctx.fillStyle = p.color;
              ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            }
            ctx.restore();
          }

          for (const b of this.beams) {
            const ratio = b.life / Math.max(1, b.maxLife);
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle);
            const width = 56 * ratio;
            ctx.globalAlpha = ratio * 0.92;
            ctx.fillStyle = b.color;
            ctx.fillRect(0, -width / 2, 740, width);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, -width * 0.28, 740, width * 0.56);
            ctx.restore();
          }

          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          for (const ft of this.floatingTexts) {
            const ratio = ft.life / Math.max(1, ft.maxLife);
            ctx.save();
            ctx.globalAlpha = clamp(ratio * 1.5, 0, 1);
            ctx.fillStyle = '#070a12';
            ctx.fillText(ft.text, Math.round(ft.x) + 1, Math.round(ft.y) + 1);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
            ctx.restore();
          }
        }
      }

      // -------------------------------------------------------------------------

      function renderStickSkeleton(ctx, joints, clothChains, bodyColor, eyeColor, wrapColor, weaponInfo, isGhost = false) {

                nodes[i + 1].y,
                thick,
                isGhost ? bodyColor : chain.color
              );
            }
          }
        }

        // Back limbs (Left Leg & Left Arm)
        drawPixelLimb(ctx, joints.hip.x, joints.hip.y, joints.kneeL.x, joints.kneeL.y, 3, bodyColor);
        drawPixelLimb(ctx, joints.kneeL.x, joints.kneeL.y, joints.footL.x, joints.footL.y, 3, bodyColor);
        if (!isGhost) {
          ctx.fillStyle = wrapColor;
          ctx.fillRect(Math.round(joints.footL.x) - 2, Math.round(joints.footL.y) - 2, 5, 3);
        }

        drawPixelLimb(ctx, joints.shoulderL.x, joints.shoulderL.y, joints.elbowL.x, joints.elbowL.y, 3, bodyColor);
        drawPixelLimb(ctx, joints.elbowL.x, joints.elbowL.y, joints.handL.x, joints.handL.y, 3, bodyColor);
        if (!isGhost) {
          ctx.fillStyle = wrapColor;
          ctx.fillRect(Math.round(joints.handL.x) - 2, Math.round(joints.handL.y) - 2, 4, 4);
        }

        // Articulated Spine (Neck -> Chest -> Hip)
        drawPixelLimb(ctx, joints.neck.x, joints.neck.y, joints.chest.x, joints.chest.y, 4, bodyColor);
        drawPixelLimb(ctx, joints.chest.x, joints.chest.y, joints.hip.x, joints.hip.y, 4, bodyColor);
        if (!isGhost) {
          ctx.fillStyle = wrapColor;
          ctx.fillRect(Math.round(joints.hip.x) - 2, Math.round(joints.hip.y) - 1, 5, 2);
        }

        // Front limbs (Right Leg & Right Arm)
        drawPixelLimb(ctx, joints.hip.x, joints.hip.y, joints.kneeR.x, joints.kneeR.y, 3, bodyColor);
        drawPixelLimb(ctx, joints.kneeR.x, joints.kneeR.y, joints.footR.x, joints.footR.y, 3, bodyColor);
        if (!isGhost) {
          ctx.fillStyle = wrapColor;
          ctx.fillRect(Math.round(joints.footR.x) - 2, Math.round(joints.footR.y) - 2, 5, 3);
        }

        drawPixelLimb(ctx, joints.shoulderR.x, joints.shoulderR.y, joints.elbowR.x, joints.elbowR.y, 3, bodyColor);
        drawPixelLimb(ctx, joints.elbowR.x, joints.elbowR.y, joints.handR.x, joints.handR.y, 3, bodyColor);
        if (!isGhost) {
          ctx.fillStyle = wrapColor;
          ctx.fillRect(Math.round(joints.handR.x) - 2, Math.round(joints.handR.y) - 2, 4, 4);
        }

        // Head & Glowing Anime Eye
        fillPixelCircle(ctx, joints.head.x, joints.head.y, 6, bodyColor);

        if (!isGhost) {
          fillPixelCircle(ctx, joints.head.x - joints.facing * 1, joints.head.y - 1, 4, '#ffffff');
          const ex = Math.round(joints.head.x + joints.facing * 2);
          const ey = Math.round(joints.head.y - 1 + (joints.headTilt || 0));
          ctx.fillStyle = eyeColor;
          ctx.fillRect(ex, ey, 3, 2);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ex + (joints.facing > 0 ? 1 : 0), ey, 1, 1);

          if (weaponInfo) {
            renderCharacterWeapon(ctx, joints, weaponInfo);
          }
        }
      }

      function renderCharacterWeapon(ctx, joints, info) {
        const f = joints.facing;
        if (info.type === 'daggers') {
          const drawDagger = (hx, hy, angle) => {
            const tx = hx + Math.cos(angle) * 13;
            const ty = hy + Math.sin(angle) * 13;
            drawPixelLimb(ctx, hx, hy, tx, ty, 2, info.primaryColor);
            drawPixelLimb(ctx, hx, hy, hx + Math.cos(angle) * 8, hy + Math.sin(angle) * 8, 1, '#ffffff');
          };
          drawDagger(joints.handR.x, joints.handR.y, info.weaponAngleR);
          drawDagger(joints.handL.x, joints.handL.y, info.weaponAngleL);
        } else if (info.type === 'katana') {
          const hx = joints.handR.x;
          const hy = joints.handR.y;
          const ang = info.weaponAngleR;
          const len = 25;
          const mx = hx + Math.cos(ang) * (len * 0.55);
          const my = hy + Math.sin(ang) * (len * 0.55);
          const tx = hx + Math.cos(ang - f * 0.14) * len;
          const ty = hy + Math.sin(ang - f * 0.14) * len;
          drawPixelLimb(ctx, hx, hy, mx, my, 2, info.primaryColor);
          drawPixelLimb(ctx, mx, my, tx, ty, 2, '#ffffff');
          ctx.fillStyle = '#fda4af';
          ctx.fillRect(Math.round(hx) - 1, Math.round(hy) - 1, 3, 3);
          drawPixelLimb(
            ctx,
            joints.hip.x - f * 3,
            joints.hip.y,
            joints.hip.x - f * 15,
            joints.hip.y - 6,
            2,
            '#881337'
          );
        } else if (info.type === 'gauntlets') {
          const rSize = info.overcharged ? 5 : 4;
          fillPixelCircle(ctx, joints.handR.x, joints.handR.y, rSize, info.primaryColor);
          fillPixelCircle(ctx, joints.handL.x, joints.handL.y, rSize, info.primaryColor);
          if (info.overcharged) {
            strokePixelCircle(ctx, joints.handR.x, joints.handR.y, rSize + 2, '#ffffff', 1);
            strokePixelCircle(ctx, joints.handL.x, joints.handL.y, rSize + 2, '#ffffff', 1);
          }
        } else if (info.type === 'astral') {
          if (info.astralBlades) {
            for (const b of info.astralBlades) {
              const bx1 = b.x - Math.cos(b.angle) * 8;
              const by1 = b.y - Math.sin(b.angle) * 8;
              const bx2 = b.x + Math.cos(b.angle) * 10;
              const by2 = b.y + Math.sin(b.angle) * 10;
              drawPixelLimb(ctx, bx1, by1, bx2, by2, 3, info.primaryColor);
              drawPixelLimb(ctx, b.x, b.y, bx2, by2, 1, '#ffffff');
            }
          }
        }
      }

      // -------------------------------------------------------------------------
      // 9. ATOMIC KO PIPELINE & MUTUAL COMBAT CLEANUP (100% DETERMINISTIC)
      // -------------------------------------------------------------------------
      let slowMoStep = 0;

      function clearMutualCombatState(p1, p2, victim = null) {
        vfx.clearTimeDilation();
        slowMoStep = 0;

        for (const f of [p1, p2]) {
          if (!f) continue;
          f.hitstop = 0;
          f.suspended = false;
          f.suspendTimer = 0;
          f.vanishPartner = null;
          f.superArmor = false;
          f.chargeFrames = 0;

          if (f.state === 'active' && (f.actionState === 'vanish_charge' || f.actionState === 'vanish_slam')) {
            f.activeAttack = null;
            f.actionState = f.grounded ? 'idle' : 'fall';
            f.animState = f.actionState;
            f.actionTimer = 0;
          }
        }

        if (victim) {
          victim.astralAnchors = [];
          victim.afterimages = [];
          gameState.projectiles = gameState.projectiles.filter((pr) => pr.owner !== victim);
          input.clearBuffers(victim.slot);
        }
      }

      function triggerKO(victim, attacker) {
        if (!victim || victim.state !== 'active') return;

        const blastX = clamp(victim.x, 40, 760);
        const blastY = clamp(victim.y, 40, 410);

        // 1. Atomic reset of victim into 'dead' lifecycle state
        victim.state = 'dead';
        victim.deadTimer = 48;
        victim.respawnTimer = 0;
        victim.invulnTimer = 0;
        victim.stocks = Math.max(0, victim.stocks - 1);
        victim.damage = 0;
        victim.damageShake = 0;
        victim.vx = 0;
        victim.vy = 0;
        victim.activeAttack = null;
        victim.hitstop = 0;
        victim.hitstun = 0;
        victim.suspended = false;
        victim.suspendTimer = 0;
        victim.vanishPartner = null;
        victim.hakiActive = false;
        victim.hakiTimer = 0;
        victim.overdriveTimer = 0;
        victim.overcharged = false;
        victim.superArmor = false;
        victim.chargeFrames = 0;
        victim.astralAnchors = [];
        victim.afterimages = [];
        victim.actionState = 'idle';
        victim.animState = 'idle';

        if (attacker) {
          attacker.kos++;
        }

        // 2. Purge all mutual interactions, slow-mo, audio ducking, and victim projectiles
        clearMutualCombatState(gameState.p1, gameState.p2, victim);

        // 3. Cinematic KO blast pillar, shockwaves, impact frame & audio
        sfx.playKO();
        vfx.spawnKOBeam(blastX, blastY, victim.def.primaryColor);
        vfx.triggerImpactFrame(4, '#ffffff');
        camera.addShake(15);

        // 4. If out of stocks, enter 50-frame dramatic 'ko_finish' before 'gameover'
        if (victim.stocks <= 0) {
          gameState.winner = attacker;
          gameState.matchState = 'ko_finish';
          gameState.finishTimer = 50;
        }
      }

      function checkBlastZones(f) {
        if (!f || f.state !== 'active') return;
        if (!Number.isFinite(f.x) || !Number.isFinite(f.y) || !Number.isFinite(f.vx) || !Number.isFinite(f.vy)) {
          const stg = getCurrentStage();
          f.x = stg.respawnX;
          f.y = stg.mainFloorY - 20;
          f.vx = 0;
          f.vy = 0;
          return;
        }
        const stg = getCurrentStage();
        if (
          f.x < stg.blastLeft ||
          f.x > stg.blastRight ||
          f.y < stg.blastTop ||
          f.y > stg.blastBottom
        ) {
          const opp = f === gameState.p1 ? gameState.p2 : gameState.p1;
          triggerKO(f, opp);
        }
      }

      // -------------------------------------------------------------------------
      // 10. FIGHTER CLASS (EXPLICIT 'active' | 'dead' | 'respawning' LIFECYCLE)
      // -------------------------------------------------------------------------
      class Fighter {
        constructor(slot, charId, isAI = false) {
          this.slot = slot; // 0 = P1, 1 = P2/CPU
          this.charId = charId;
          this.def = CHARACTERS[charId];
          this.isAI = isAI;

          // Match stats
          this.stocks = 3;
          this.kos = 0;
          this.damage = 0;
          this.damageShake = 0;

          // Explicit Lifecycle State: 'active' | 'dead' | 'respawning'
          this.state = 'active';
          this.deadTimer = 0;
          this.respawnTimer = 0;
          this.invulnTimer = 0;

          // Sub-action & animation state
          this.actionState = 'idle';
          this.animState = 'idle';
          this.actionTimer = 0;

          // Spatial & physics state
          const stg = getCurrentStage();
          this.x = slot === 0 ? 290 : 510;
          this.y = stg.mainFloorY;
          this.vx = 0;
          this.vy = 0;
          this.facing = slot === 0 ? 1 : -1;
          this.grounded = true;
          this.onPlatform = false;
          this.jumpsUsed = 0;
          this.airDodgeUsed = false;
          this.fastFalling = false;
          this.dropThroughTimer = 0;
          this.crouching = false;

          // Combat & frame data state
          this.hitstop = 0;
          this.hitstun = 0;
          this.vibrateX = 0;
          this.superArmor = false;
          this.suspended = false;
          this.suspendTimer = 0;
          this.vanishPartner = null;

          this.activeAttack = null;
          this.moveFrame = 0;
          this.chargeFrames = 0;
          this.jabStep = 0;
          this.jabWindow = 0;
          this.hitTargets = new Set();

          // Character unique traits
          this.meter = 0;
          this.overdriveTimer = 0; // Kaze
          this.hakiActive = false; // Kage
          this.hakiTimer = 0;
          this.overcharged = false; // Raijin
          this.astralAnchors = []; // Soren
          this.astralOrbitTime = 0;

          // Afterimages & Verlet cloth trails
          this.afterimages = [];
          this.scaleX = 1;
          this.scaleY = 1;
          this.animTime = 0;
          this.clothNodes = [];
          this.clothChains = this.initClothChains(this.x, this.y, this.facing);
          this.joints = this.computePose();

          // AI state
          this.aiTimer = 0;
          this.aiDir = 0;
        }

        initClothChains(bx, by, f) {
          this.clothNodes = [];
          const makeChain = (anchor, color, thickness, segLen, count, baseYOff) => {
            const nodes = [];
            for (let i = 0; i < count; i++) {
              const node = {
                x: bx - f * (i * 4 + 2),
                y: by + baseYOff + i * 2
              };
              nodes.push(node);
              this.clothNodes.push(node);
            }
            return { anchor, color, thickness, segLen, nodes };
          };

          if (this.charId === 'kaze') {
            return [makeChain('neck', this.def.clothSecondary, 5, 4.4, 6, -26)];
          } else if (this.charId === 'kage') {
            return [
              makeChain('hip', this.def.clothPrimary, 5, 4.2, 5, -14),
              makeChain('headBack', this.def.clothSecondary, 3, 3.8, 4, -35)
            ];
          } else if (this.charId === 'raijin') {
            return [makeChain('hip', this.def.clothSecondary, 4, 4.0, 5, -14)];
          } else {
            return [makeChain('hip', this.def.clothSecondary, 5, 4.5, 6, -14)];
          }
        }

        spawnAfterimage(color, alpha = 0.55, life = 12) {
          if (!this.joints) return;
          this.afterimages.push({
            joints: JSON.parse(JSON.stringify(this.joints)),
            clothChains: this.clothChains.map((c) => ({
              color: c.color,
              thickness: c.thickness,
              nodes: c.nodes.map((n) => ({ x: n.x, y: n.y }))
            })),
            color,
            alpha,
            life,
            maxLife: life
          });
        }

        // Transition from 'dead' -> 'respawning' on top-center halo at (400, 92)
        beginRespawn() {
          this.state = 'respawning';
          this.respawnTimer = 95;
          this.invulnTimer = 160;
          this.x = 400;
          this.y = 92;
          this.vx = 0;
          this.vy = 0;
          this.facing = this === gameState.p1 ? 1 : -1;
          this.jumpsUsed = 0;
          this.airDodgeUsed = false;
          this.grounded = false;
          this.onPlatform = false;
          this.fastFalling = false;
          this.actionState = 'idle';
          this.animState = 'idle';
          this.activeAttack = null;
          this.hitstop = 0;
          this.hitstun = 0;
          this.suspended = false;
          this.suspendTimer = 0;
          this.vanishPartner = null;
          this.scaleX = 1;
          this.scaleY = 1;

          // Reset every node i of clothNodes to staggered coordinates & clear afterimages
          for (let i = 0; i < this.clothNodes.length; i++) {
            this.clothNodes[i].x = 400 - this.facing * (i * 4 + 2);
            this.clothNodes[i].y = 92 + i * 2;
          }
          this.afterimages = [];
          this.joints = this.computePose();

          sfx.playRespawnHalo();
          vfx.spawnShockwave(400, 92, 42, this.def.primaryColor, 2, 18);
          vfx.spawnFloatingText(400, 62, 'READY', this.def.primaryColor);
        }

        isTargetable() {
          return this.state === 'active' && this.invulnTimer <= 0;
        }

        canTriggerVanish(opponent) {
          if (!opponent || !opponent.isTargetable()) return false;
          const stg = getCurrentStage();
          const oppAirborne = !opponent.grounded && opponent.y < stg.mainFloorY - 14;
          const inLaunchState = opponent.hitstun > 0 || opponent.vy < -2.2 || opponent.damage >= 45;
          const withinRange = dist(this.x, this.y, opponent.x, opponent.y) < 340;
          return oppAirborne && inLaunchState && withinRange;
        }

        startVanishStrike(opponent) {
          if (!opponent || !opponent.isTargetable()) return;

          this.actionState = 'vanish_charge';
          this.animState = 'vanish_charge';
          this.actionTimer = 0;
          this.vanishPartner = opponent;
          this.activeAttack = null;
          this.fastFalling = false;
          this.superArmor = true;
          this.suspended = true;
          this.suspendTimer = 34;

          this.spawnAfterimage(this.def.primaryColor, 0.85, 16);
          vfx.spawnShockwave(this.x, this.y - 18, 34, '#ffffff', 2, 12);

          const offsetX = -opponent.facing * 30;
          this.x = clamp(opponent.x + offsetX, 60, 740);
          this.y = clamp(opponent.y - 8, 45, getCurrentStage().mainFloorY - 26);
          this.facing = opponent.x >= this.x ? 1 : -1;
          this.vx = 0;
          this.vy = 0;

          opponent.vx = 0;
          opponent.vy = 0;
          opponent.suspended = true;
          opponent.suspendTimer = 36;
          opponent.vanishPartner = this;
          opponent.hitstun = Math.max(opponent.hitstun, 40);
          opponent.actionState = 'hitstun';
          opponent.animState = 'hitstun';

          sfx.playVanish();
          sfx.playVanishCharge();
          vfx.triggerTimeDilation(0.45, 22);
          vfx.spawnShockwave(this.x, this.y - 18, 42, this.def.primaryColor, 3, 18);
          vfx.spawnFloatingText(this.x, this.y - 44, 'VANISH!', this.def.primaryColor);
        }

        getMoveDefinition(category, dir) {
          const id = this.charId;
          const f = this.facing;

          const makeMove = (cfg) => ({
            name: cfg.name || 'Strike',
            poseKey: cfg.poseKey || 'lunge_strike',
            startup: Math.max(4, Math.round((cfg.startup || 5) * 1.35)),
            active: Math.max(4, Math.round((cfg.active || 5) * 1.3)),
            recovery: Math.max(8, Math.round((cfg.recovery || 10) * 1.3)),
            damage: cfg.damage || 8,
            baseKb: (cfg.baseKb || 5.2) * 0.78,
            kbScale: (cfg.kbScale || 0.065) * 0.78,
            angle: cfg.angle !== undefined ? cfg.angle : -0.45,
            hitstop: Math.round((cfg.hitstop || 6) * 1.35),
            power: cfg.power || 1,
            hitbox: cfg.hitbox || { ox: 22, oy: -18, r: 18 },
            dashVx: (cfg.dashVx || 0) * 0.75,
            isLauncher: !!cfg.isLauncher,
            isFinisher: !!cfg.isFinisher,
            slashArc: cfg.slashArc || null,
            onStartup: cfg.onStartup || null,
            onActive: cfg.onActive || null
          });

          if (category === 'light') {
            if (this.grounded) {
              if (dir === 'up') {
                return makeMove({

                  poseKey: 'uppercut',

                  slashArc: { ox: 12, oy: -20, r: 26, start: -Math.PI * 0.88, end: -Math.PI * 0.12 }
                });
              }
              if (dir === 'down') {
                return makeMove({
                  name: 'Down-Light Sweep',
                  poseKey: 'low_sweep',
                  startup: 5,
                  active: 5,
                  recovery: 10,
                  damage: 7,
                  baseKb: 6.4,
                  kbScale: 0.05,
                  angle: -1.15,
                  hitstop: 6,
                  power: 1,
                  isLauncher: true,
                  dashVx: f * 2.6,
                  hitbox: { ox: 22, oy: -7, r: 17 },
                  slashArc: { ox: 16, oy: -6, r: 23, start: 0.1, end: 1.15 }
                });
              }
              if (dir === 'left' || dir === 'right') {
                return makeMove({

                  kbScale: 0.06,
                  angle: -0.35,
                  hitstop: 6,
                  power: 1,
                  dashVx: f * (id === 'kaze' ? 5.2 : 3.6),

                  slashArc: { ox: 18, oy: -18, r: 25, start: -0.75, end: 0.65 }

              }

              } else if (step === 1) {

                  baseKb: 2.4,
                  kbScale: 0.02,
                  angle: -0.25,
                  hitstop: 4,
                  power: 1,
                  dashVx: f * 2.1,
                  hitbox: { ox: 22, oy: -19, r: 17 },
                  slashArc: { ox: 16, oy: -19, r: 22, start: 0.65, end: -0.65 }
                });
              } else {
                return makeMove({
                  name: 'Jab Finisher',
                  poseKey: 'roundhouse',
                  startup: 5,
                  active: 5,
                  recovery: 12,
                  damage: 8,
                  baseKb: 6.8,
                  kbScale: 0.075,
                  angle: -0.45,
                  hitstop: 8,
                  power: 2,
                  dashVx: f * 3.5,
                  hitbox: { ox: 25, oy: -18, r: 20 },
                  slashArc: { ox: 18, oy: -18, r: 27, start: -0.95, end: 0.85 }
                });
              }
            } else {
              if (dir === 'up') {
                return makeMove({
                  name: 'Up-Air',

                  kbScale: 0.07,
                  angle: -0.35,

        startAttack(category, dir) {
          if (dir === 'left') this.facing = -1;
          if (dir === 'right') this.facing = 1;

          const move = this.getMoveDefinition(category, dir);
          this.actionState = 'attack';
          this.animState = 'attack';
          this.activeAttack = move;
          this.moveFrame = 0;
          this.chargeFrames = 0;
          this.hitTargets.clear();
          this.superArmor = false;

          if (this.charId === 'raijin' && this.overcharged && (category === 'strong' || category === 'special')) {
            this.superArmor = true;
            move.damage = Math.round(move.damage * 1.25);
            move.baseKb *= 1.15;
            move.hitstop += 3;
            this.overcharged = false;
            this.meter = 0;
            vfx.spawnFloatingText(this.x, this.y - 42, 'OVERCHARGED!', '#facc15');
          }

          if (this.charId === 'kaze' && this.overdriveTimer > 0) {
            move.startup = Math.max(2, move.startup - 1);
            if (move.dashVx) move.dashVx *= 1.35;
          }

          if (category === 'light' && this.grounded && dir === 'neutral') {
            this.jabStep = (this.jabStep + 1) % 3;
            this.jabWindow = 26;
          } else {
            this.jabStep = 0;
          }

          if (move.onStartup) {
            move.onStartup(this);
          } else {
            sfx.playSwing(move.power >= 2, this.def.weaponType);
          }
        }

        startDodge(dir) {
          if (!this.grounded && this.airDodgeUsed) return;

          this.actionState = 'dodge';
          this.animState = 'dodge';
          this.actionTimer = 18;
          this.invulnTimer = Math.max(this.invulnTimer, 14);
          this.activeAttack = null;
          this.fastFalling = false;

          let dx = 0;
          let dy = 0;
          if (dir === 'left') dx = -1;
          else if (dir === 'right') dx = 1;
          else if (dir === 'up') dy = -1;
          else if (dir === 'down') dy = 1;
          else dx = this.facing;

          if (!this.grounded) {
            this.airDodgeUsed = true;
            this.vx = dx * 5.85;
            this.vy = dy * 5.1;
            this.spawnAfterimage('#ffffff', 0.65, 15);

        updateAfterimages() {
          for (let i = this.afterimages.length - 1; i >= 0; i--) {
            this.afterimages[i].life--;

              this.afterimages.splice(i, 1);
