        // Main Fighter Tick
        update(opponent, projectiles, camera) {
          this.animTime += 0.11;
          this.updateAfterimages();

          // -------------------------------------------------------------------
          // LIFECYCLE STATE 1: 'dead'
          // -------------------------------------------------------------------
          if (this.state === 'dead') {
            this.deadTimer--;
            if (this.deadTimer <= 0 && this.stocks > 0) {
              this.beginRespawn();
            }
            return;
          }

          // Gather input for either 'respawning' or 'active'
          let ctrl = {
            axisX: 0,
            axisY: 0,
            holdStrong: false,
            bufferedAction: null
          };

          if (this.isAI) {
            ctrl = this.computeAIControls(opponent);
          } else {
            ctrl.axisX = input.getAxisX(this.slot);
            ctrl.axisY = input.getAxisY(this.slot);
            ctrl.holdStrong = input.isHoldingStrong(this.slot);
          }

          // -------------------------------------------------------------------
          // LIFECYCLE STATE 2: 'respawning' (Hovering halo at 400, 92)
          // -------------------------------------------------------------------
          if (this.state === 'respawning') {
            if (this.invulnTimer > 0) this.invulnTimer--;
            this.respawnTimer--;
            this.y = 92;
            this.vy = 0;
            this.vx = 0;

            if (ctrl.axisX !== 0) {
              this.x = clamp(this.x + ctrl.axisX * 2.6, 190, 610);
              this.facing = ctrl.axisX;
            }

            const act = this.isAI ? ctrl.bufferedAction : input.peekBuffer(this.slot);
            const playerDroppedIn =
              !this.isAI && (ctrl.axisX !== 0 || ctrl.axisY !== 0 || act !== null);
            const aiDroppedIn = this.isAI && this.respawnTimer <= 65;

            if (this.respawnTimer <= 0 || playerDroppedIn || aiDroppedIn) {
              this.state = 'active';
              this.actionState = 'fall';
              this.animState = 'fall';
              this.grounded = false;
              this.onPlatform = false;
              // If dropping in with an attack/special, consume spawn invulnerability fairly
              if (act && (act.action === 'light' || act.action === 'strong' || act.action === 'special')) {
                this.invulnTimer = 0;
              }
            } else {
              this.updateClothChains();
              this.joints = this.computePose();
              return;
            }
          }

          // -------------------------------------------------------------------
          // LIFECYCLE STATE 3: 'active'
          // -------------------------------------------------------------------
          if (this.hitstop > 0) {
            this.hitstop--;
            if (this.hitstun > 0) {
              this.vibrateX = (this.hitstop % 2 === 0 ? 1 : -1) * 2.5;
            }
            this.updateClothChains();
            this.joints = this.computePose();
            return;
          }
          this.vibrateX = 0;

          if (this.invulnTimer > 0) this.invulnTimer--;
          if (this.dropThroughTimer > 0) this.dropThroughTimer--;
          if (this.jabWindow > 0) {
            this.jabWindow--;
            if (this.jabWindow === 0) this.jabStep = 0;
          }
          if (this.damageShake > 0) this.damageShake *= 0.84;

          if (this.suspendTimer > 0) {
            this.suspendTimer--;
            if (this.suspendTimer <= 0) {
              this.suspended = false;
              this.vanishPartner = null;
            }
          }

          // Character unique passive ticks
          if (this.charId === 'kaze') {
            if (this.overdriveTimer > 0) {
              this.overdriveTimer--;
              this.meter = (this.overdriveTimer / 420) * 100;
              if (this.overdriveTimer % 3 === 0) {
                this.spawnAfterimage('#38bdf8', 0.42, 10);
              }
            } else if (Math.abs(this.vx) > 2.2) {
              this.meter = clamp(this.meter + 0.22, 0, 100);
            }
          }

          if (this.charId === 'kage') {
            if (this.hakiTimer > 0) {
              this.hakiTimer--;
              if (this.hakiTimer <= 0) this.hakiActive = false;
            }
          }

          if (this.charId === 'soren') {
            this.astralOrbitTime += 0.08;
            for (let i = this.astralAnchors.length - 1; i >= 0; i--) {
              const anc = this.astralAnchors[i];
              anc.life--;
              anc.angle += 0.14;
              if (opponent && opponent.isTargetable() && anc.life % 18 === 0) {
                if (dist(anc.x, anc.y, opponent.x, opponent.y - 18) < 18) {
                  applyHit(
                    this,
                    opponent,
                    {
                      damage: 3,
                      baseKb: 3.2,
                      kbScale: 0.02,
                      angle: -0.6,
                      hitstop: 3,
                      power: 1
                    },
                    camera
                  );
                }
              }
              if (anc.life <= 0) this.astralAnchors.splice(i, 1);
            }
          }

          this.scaleX = lerp(this.scaleX, 1, 0.22);
          this.scaleY = lerp(this.scaleY, 1, 0.22);

          // Mid-Air Vanish-Strike Zero-Gravity Charge & Slam
          if (this.actionState === 'vanish_charge') {
            this.actionTimer++;
            this.vx = 0;
            this.vy = 0;
            this.suspended = true;

            if (!this.vanishPartner || this.vanishPartner.state !== 'active') {
              this.suspended = false;
              this.suspendTimer = 0;
              this.vanishPartner = null;
              this.superArmor = false;
              this.actionState = this.grounded ? 'idle' : 'fall';
              this.animState = this.actionState;
              this.updateClothChains();
              this.joints = this.computePose();
              return;
            }

            if (this.vanishPartner.hitstun > 0) {
              this.vanishPartner.vx = 0;
              this.vanishPartner.vy = 0;
              this.vanishPartner.suspended = true;
            }

            if (this.actionTimer % 5 === 0) {
              vfx.spawnShockwave(this.x, this.y - 18, Math.max(4, 36 - this.actionTimer), this.def.primaryColor, 2, 10);
            }

            if (this.actionTimer >= 32) {
              this.actionState = 'vanish_slam';
              this.animState = 'vanish_slam';
              this.actionTimer = 0;
              this.superArmor = false;
              sfx.playSwing(true, this.def.weaponType);
              vfx.spawnSlashArc(
                this.x + this.facing * 12,
                this.y - 14,
                34,
                -1.2,
                1.3,
                this.def.primaryColor,
                9,
                16
              );

              if (this.vanishPartner && this.vanishPartner.isTargetable()) {
                this.vanishPartner.suspended = false;
                this.vanishPartner.suspendTimer = 0;
                applyHit(
                  this,
                  this.vanishPartner,
                  {
                    name: 'Anime Vanish Finisher',
                    damage: 17,
                    baseKb: 9.2,
                    kbScale: 0.095,
                    angle: 0.82,
                    hitstop: 14,
                    power: 3,
                    isFinisher: true
                  },
                  camera
                );
              }
            }

            this.updateClothChains();
            this.joints = this.computePose();
            return;
          }

          if (this.actionState === 'vanish_slam') {
            this.actionTimer++;
            this.suspended = false;
            this.suspendTimer = 0;
            this.vy += this.def.stats.gravity * 0.85;
            this.y += this.vy;
            this.handleStageCollisions();
            if (this.grounded || this.actionTimer >= 16) {
              this.actionState = this.grounded ? 'idle' : 'fall';
              this.animState = this.actionState;
              this.vanishPartner = null;
            }
            this.updateClothChains();
            this.joints = this.computePose();
            return;
          }

          // Hitstun State
          if (this.hitstun > 0) {
            this.hitstun--;
            if (this.suspendTimer <= 0) {
              this.suspended = false;
            }
            this.vx += ctrl.axisX * 0.08;
            this.vy += ctrl.axisY * 0.06;

            if (this.hitstun % 4 === 0 && Math.hypot(this.vx, this.vy) > 6.5) {
              vfx.spawnDust(this.x, this.y - 14, 0, '#94a3b8', 1);
            }

            if (this.hitstun <= 0) {
              this.suspended = false;
              this.actionState = this.grounded ? 'idle' : 'fall';
              this.animState = this.actionState;
            }
          }

          // Dodge State
          if (this.actionState === 'dodge') {
            this.actionTimer--;
            this.vx *= 0.88;
            this.vy *= 0.88;
            if (this.actionTimer <= 0) {
              this.actionState = this.grounded ? 'idle' : 'fall';
              this.animState = this.actionState;
            }
          }

          // Active Attack State
          if (this.actionState === 'attack' && this.activeAttack) {
            const mv = this.activeAttack;

            if (
              mv.name &&
              mv.name.includes('Strong') &&
              this.moveFrame === 3 &&
              ctrl.holdStrong &&
              this.chargeFrames < 85
            ) {
              this.chargeFrames++;
              this.vx *= 0.75;
              if (this.chargeFrames % 8 === 0) {
                vfx.spawnShockwave(this.x, this.y - 18, 28, this.def.primaryColor, 2, 10);
                if (this.charId === 'raijin') {
                  this.meter = clamp(this.meter + 8, 0, 100);
                  if (this.meter >= 100) this.overcharged = true;
                }
              }
              this.updateClothChains();
              this.joints = this.computePose();
              return;
            }

            this.moveFrame++;

            if (this.moveFrame >= mv.startup && this.moveFrame < mv.startup + mv.active) {
              if (mv.dashVx && this.moveFrame === mv.startup) {
                this.vx = mv.dashVx;
              }
              if (this.moveFrame === mv.startup && mv.onActive) {
                mv.onActive(this);
              }
              if (this.moveFrame === mv.startup && mv.slashArc) {
                const sa = mv.slashArc;
                const startA = this.facing === 1 ? sa.start : Math.PI - sa.end;
                const endA = this.facing === 1 ? sa.end : Math.PI - sa.start;
                vfx.spawnSlashArc(
                  this.x + sa.ox * this.facing,
                  this.y + sa.oy,
                  sa.r,
                  startA,
                  endA,
                  this.def.primaryColor,
                  mv.power >= 3 ? 8 : 5,
                  13
                );
              }

              if (mv.hitbox && opponent && opponent.isTargetable() && !this.hitTargets.has(opponent)) {
                const hx = this.x + mv.hitbox.ox * this.facing;
                const hy = this.y + mv.hitbox.oy;
                const oppCenterY = opponent.y - 17;
                if (dist(hx, hy, opponent.x, oppCenterY) <= mv.hitbox.r + 12) {
                  if (
                    opponent.charId === 'kage' &&
                    (opponent.hakiActive || opponent.hakiTimer > 0 || (opponent.meter >= 100 && opponent.hitstun <= 0))
                  ) {
                    this.hitTargets.add(opponent);
                    opponent.triggerObservationHakiCounter(this);
                  } else {
                    this.hitTargets.add(opponent);
                    const chargeMult = 1 + (this.chargeFrames / 85) * 0.45;
                    const resolvedMove = {
                      ...mv,
                      damage: Math.round(mv.damage * chargeMult),
                      baseKb: mv.baseKb * (1 + (this.chargeFrames / 85) * 0.3)
                    };
                    applyHit(this, opponent, resolvedMove, camera);

                    if (this.charId === 'kaze' && this.overdriveTimer > 0) {
                      vfx.spawnHitSparks(opponent.x, opponent.y - 18, 0, '#38bdf8', 8, 1.1);
                      opponent.damage = clamp(opponent.damage + 3, 0, 999);
                    }
                  }
                }
              }
            }

            if (
              this.moveFrame > mv.startup + mv.active &&
              this.hitTargets.size > 0 &&
              this.canTriggerVanish(opponent)
            ) {
              const buffered = this.isAI ? ctrl.bufferedAction : input.peekBuffer(this.slot, ['strong', 'special']);
              if (buffered && (buffered.action === 'strong' || buffered.action === 'special')) {
                if (!this.isAI) input.consumeBuffer(this.slot, ['strong', 'special']);
                this.startVanishStrike(opponent);
                return;
              }
            }

            const totalFrames = mv.startup + mv.active + mv.recovery;
            if (this.moveFrame >= totalFrames) {
              this.actionState = this.grounded ? 'idle' : 'fall';
              this.animState = this.actionState;
              this.activeAttack = null;
              this.superArmor = false;
            }
          }

          // Actionable Movement, Jumps, & Buffered Actions
          const isActionable =
            this.hitstun <= 0 &&
            this.actionState !== 'attack' &&
            this.actionState !== 'dodge' &&
            this.actionState !== 'vanish_charge' &&
            this.actionState !== 'vanish_slam';

          if (isActionable) {
            const speedMult = this.charId === 'kaze' && this.overdriveTimer > 0 ? 1.45 : 1.0;

            if (this.grounded) {
              this.crouching = ctrl.axisY > 0;

              if (
                this.onPlatform &&
                ctrl.axisY > 0 &&
                (this.isAI ||
                  input.doubleTapped[this.slot].down ||
                  (this.slot === 0 && (input.justPressed['KeyS'] || (gameState.mode !== '2P' && input.justPressed['ArrowDown']))) ||
                  (this.slot === 1 && input.justPressed['ArrowDown']))
              ) {
                this.dropThroughTimer = 14;
                this.grounded = false;
                this.onPlatform = false;
                this.y += 4;
                this.vy = 2.5;
              }

              if (ctrl.axisX !== 0 && !this.crouching) {
                this.facing = ctrl.axisX;
                const isDashing =
                  (!this.isAI && (input.doubleTapped[this.slot].left || input.doubleTapped[this.slot].right)) ||
                  Math.abs(this.vx) > this.def.stats.walkSpeed * speedMult + 0.5;
                const targetVx =
                  ctrl.axisX * (isDashing ? this.def.stats.dashSpeed : this.def.stats.walkSpeed) * speedMult;
                if (isDashing && Math.abs(this.vx) < 3) {
                  vfx.spawnDust(this.x, this.y, -this.facing, '#cbd5e1', 5);
                  sfx.playDash();
                }
                this.vx = lerp(this.vx, targetVx, 0.34);
                this.actionState = 'run';
                this.animState = 'run';
              } else {
                this.vx = lerp(this.vx, 0, 0.32);
                this.actionState = this.crouching ? 'crouch' : 'idle';
                this.animState = this.actionState;
              }
            } else {
              this.crouching = false;
              if (ctrl.axisX !== 0) {
                const targetAirVx = ctrl.axisX * this.def.stats.airSpeed * speedMult;
                this.vx = lerp(this.vx, targetAirVx, 0.14);
              } else {
                this.vx *= 0.96;
              }

              if (ctrl.axisY > 0 && this.vy > 0 && !this.fastFalling) {
                this.fastFalling = true;
                this.vy = this.def.stats.fastFallSpeed;
                vfx.spawnDust(this.x, this.y - 16, 0, '#7dd3fc', 3);
                sfx.playDash();
              }

              this.actionState = this.vy < 0 ? 'jump' : 'fall';
              this.animState = this.actionState;
            }

            const act = this.isAI ? ctrl.bufferedAction : input.consumeBuffer(this.slot);
            if (act) {
              if (act.action === 'jump' || act.action === 'shorthop') {
                if (this.grounded) {
                  this.grounded = false;
                  this.onPlatform = false;
                  this.fastFalling = false;
                  this.jumpsUsed = 1;
                  this.vy = act.action === 'shorthop' ? this.def.stats.shortHopForce : this.def.stats.jumpForce;
                  this.scaleX = 0.76;
                  this.scaleY = 1.26;
                  sfx.playJump(false);
                  vfx.spawnDust(this.x, this.y, 0, '#e2e8f0', 6);
                } else if (this.jumpsUsed < 2) {
                  this.jumpsUsed++;
                  this.fastFalling = false;
                  this.vy = this.def.stats.doubleJumpForce;
                  if (ctrl.axisX !== 0) {
                    this.facing = ctrl.axisX;
                    this.vx = ctrl.axisX * this.def.stats.airSpeed * speedMult;
                  }
                  this.scaleX = 0.78;
                  this.scaleY = 1.24;
                  sfx.playJump(true);
                  vfx.spawnShockwave(this.x, this.y, 24, this.def.primaryColor, 2, 12);
                }
              } else if (act.action === 'light') {
                this.startAttack('light', act.dir);
              } else if (act.action === 'strong') {
                if (this.canTriggerVanish(opponent)) {
                  this.startVanishStrike(opponent);
                } else {
                  this.startAttack('strong', act.dir);
                }
              } else if (act.action === 'special') {
                this.executeSpecial(act.dir, opponent, projectiles);
              } else if (act.action === 'dodge') {
                this.startDodge(act.dir);
              }
            }
          }

          // Gravity & Velocity Integration
          if (!this.suspended) {
            if (!this.grounded) {
              const grav = this.fastFalling ? this.def.stats.gravity * 1.45 : this.def.stats.gravity;
              this.vy = Math.min(this.def.stats.fastFallSpeed + 2, this.vy + grav);
            }
            this.x += this.vx;
            this.y += this.vy;
          }

          // Stage Floor, Platforms, & Ledge Collisions
          this.handleStageCollisions();

          // Verlet Cloth Trails & Multi-Phase Pose
          this.updateClothChains();
          this.joints = this.computePose();
        }

        handleStageCollisions() {
          const stg = getCurrentStage();
          const prevY = this.y - this.vy;
          const wasGrounded = this.grounded;
          this.grounded = false;
          this.onPlatform = false;

          if (
            this.vy >= 0 &&
            prevY <= stg.mainFloorY + 6 &&
            this.y >= stg.mainFloorY &&
            this.x >= stg.mainLeft - 6 &&
            this.x <= stg.mainRight + 6
          ) {
            this.y = stg.mainFloorY;
            if (!wasGrounded && this.vy > 3.5) {
              this.scaleX = 1.24;
              this.scaleY = 0.76;
              vfx.spawnDust(this.x, this.y, 0, '#cbd5e1', 5);
            }
            this.vy = 0;
            this.grounded = true;
            this.jumpsUsed = 0;
            this.airDodgeUsed = false;
            this.fastFalling = false;
            return;
          }

          if (this.y > stg.mainFloorY + 6 && this.y < stg.mainFloorY + stg.mainThickness) {
            if (this.x > stg.mainLeft - 8 && this.x < 400 && this.vx > 0) {
              this.x = stg.mainLeft - 8;
              this.vx = 0;
              if (this.y < stg.mainFloorY + 24 && this.vy > 0) {
                this.vy = -5.5;
                this.jumpsUsed = 1;
              }
            } else if (this.x < stg.mainRight + 8 && this.x > 400 && this.vx < 0) {
              this.x = stg.mainRight + 8;
              this.vx = 0;
              if (this.y < stg.mainFloorY + 24 && this.vy > 0) {
                this.vy = -5.5;
                this.jumpsUsed = 1;
              }
            }
          }

          if (this.vy >= 0 && this.dropThroughTimer <= 0 && this.hitstun <= 0) {
            for (const plat of stg.platforms) {
              if (
                prevY <= plat.y + 5 &&
                this.y >= plat.y &&
                this.x >= plat.x &&
                this.x <= plat.x + plat.w
              ) {
                this.y = plat.y;
                if (!wasGrounded && this.vy > 3.5) {
                  this.scaleX = 1.2;
                  this.scaleY = 0.8;
                  vfx.spawnDust(this.x, this.y, 0, '#e2e8f0', 4);
                }
                this.vy = 0;
                this.grounded = true;
                this.onPlatform = true;
                this.jumpsUsed = 0;
                this.airDodgeUsed = false;
                this.fastFalling = false;
                return;
              }
            }
          }
        }

        updateClothChains() {
          const bx = this.x + this.vibrateX;
          const by = this.y;
          const f = this.facing;
          const sy = this.scaleY;

          for (const chain of this.clothChains) {
            let ax = bx - f * 2;
            let ay = by - 26 * sy;
            if (chain.anchor === 'hip') {
              ax = bx - f * 2;
              ay = by - 14 * sy;
            } else if (chain.anchor === 'headBack') {
              ax = bx - f * 4;
              ay = by - 35 * sy;
            }

            chain.nodes[0].x = ax;
            chain.nodes[0].y = ay;

            const windX = -f * 2.5 - this.vx * 0.45 + Math.sin(this.animTime * 1.4) * 1.1;
            const windY = -this.vy * 0.35 + Math.cos(this.animTime * 1.7) * 0.8 + 0.55;

            for (let i = 1; i < chain.nodes.length; i++) {
              const prev = chain.nodes[i - 1];
              const curr = chain.nodes[i];
              curr.x += windX * (0.55 + i * 0.08);
              curr.y += windY * (0.5 + i * 0.06);

              const dx = curr.x - prev.x;
              const dy = curr.y - prev.y;
              const d = safeHypot(dx, dy);
              if (d > chain.segLen) {
                curr.x = prev.x + (dx / d) * chain.segLen;
                curr.y = prev.y + (dy / d) * chain.segLen;
              }
            }
          }
        }

        computePose() {
          const f = this.facing;
          const bx = this.x + this.vibrateX;
          const by = this.y;
          const sx = this.scaleX;
          const sy = this.scaleY;

          const breathe = this.animState === 'idle' ? Math.sin(this.animTime * 0.9) * 1.1 : 0;
          const crouchOff = this.crouching ? 6 : 0;

          let lean = f * 2;
          let chestLean = f * 2.5;
          let headTilt = 0;

          let hipY = by - (14 - crouchOff * 0.5 - breathe * 0.4) * sy;
          let chestY = by - (21 - crouchOff * 0.75 - breathe * 0.7) * sy;
          let neckY = by - (27 - crouchOff - breathe) * sy;
          let headY = by - (34 - crouchOff - breathe) * sy;

          let footL = { x: bx - f * 5 * sx, y: by };
          let footR = { x: bx + f * 6 * sx, y: by };
          let kneeL = { x: bx - f * 3 * sx, y: by - 7 * sy + breathe * 0.3 };
          let kneeR = { x: bx + f * 4 * sx, y: by - 7 * sy + breathe * 0.3 };

          let shoulderL = { x: bx + chestLean - f * 2, y: neckY + 2 };
          let shoulderR = { x: bx + chestLean + f * 2, y: neckY + 2 };
          let elbowL = { x: bx - f * 5 * sx, y: neckY + 5 * sy };
          let elbowR = { x: bx + f * 5 * sx, y: neckY + 5 * sy };
          let handL = { x: bx - f * 6 * sx, y: neckY + 9 * sy + breathe * 0.5 };
          let handR = { x: bx + f * 9 * sx, y: neckY + 7 * sy + breathe * 0.5 };

          let weaponAngleR = f === 1 ? -0.35 : Math.PI + 0.35;
          let weaponAngleL = f === 1 ? 0.5 : Math.PI - 0.5;

          if (this.animState === 'run') {
            const cycle = Math.sin(this.animTime * 2.5);
            const oppCycle = Math.sin(this.animTime * 2.5 + Math.PI);
            lean = f * 7;
            chestLean = f * 8;
            headTilt = 1;
            footR = { x: bx + f * cycle * 11, y: by - Math.max(0, -oppCycle * 4.5) };
            footL = { x: bx + f * oppCycle * 11, y: by - Math.max(0, -cycle * 4.5) };
            kneeR = { x: (bx + footR.x) * 0.5 + f * 3.5, y: (hipY + footR.y) * 0.5 - 2 };
            kneeL = { x: (bx + footL.x) * 0.5 + f * 3.5, y: (hipY + footL.y) * 0.5 - 2 };
            shoulderL = { x: bx + chestLean - f * 2, y: neckY + 2 };
            shoulderR = { x: bx + chestLean + f * 2, y: neckY + 2 };
            handR = { x: bx - f * cycle * 9, y: neckY + 7 };
            handL = { x: bx - f * oppCycle * 9, y: neckY + 7 };
            elbowR = { x: (shoulderR.x + handR.x) * 0.5 - f * 2, y: neckY + 4 };
            elbowL = { x: (shoulderL.x + handL.x) * 0.5 - f * 2, y: neckY + 4 };
            weaponAngleR = f === 1 ? 2.55 : 0.55;
          } else if (this.animState === 'jump') {
            lean = f * 3;
            chestLean = f * 4;
            headTilt = -1;
            footR = { x: bx + f * 7, y: by - 5 };
            kneeR = { x: bx + f * 10, y: hipY + 2 };
            footL = { x: bx - f * 6, y: by - 1 };
            kneeL = { x: bx - f * 4, y: hipY + 6 };
            handR = { x: bx + f * 10, y: neckY };
            handL = { x: bx - f * 9, y: neckY + 2 };
          } else if (this.animState === 'fall') {
            lean = f * 2;
            chestLean = f * 3;
            headTilt = 1;
            footR = { x: bx + f * 6, y: by - 2 };
            kneeR = { x: bx + f * 8, y: hipY + 5 };
            footL = { x: bx - f * 5, y: by };
            kneeL = { x: bx - f * 3, y: hipY + 7 };
            handR = { x: bx + f * 9, y: neckY - 3 };
            handL = { x: bx - f * 9, y: neckY - 2 };
          } else if (this.animState === 'hitstun') {
            lean = -f * 8;
            chestLean = -f * 6;
            headY += 2;
            headTilt = -1;
            handR = { x: bx - f * 10, y: neckY - 3 };
            handL = { x: bx - f * 6, y: neckY + 4 };
            footR = { x: bx + f * 8, y: by - 4 };
            footL = { x: bx + f * 3, y: by - 2 };
          } else if (this.animState === 'vanish_charge') {
            lean = f * 6;
            chestLean = f * 7;
            handR = { x: bx - f * 11, y: neckY - 4 };
            elbowR = { x: bx - f * 6, y: neckY - 2 };
            handL = { x: bx + f * 10, y: neckY + 3 };
            kneeR = { x: bx + f * 8, y: hipY + 2 };
            footR = { x: bx + f * 4, y: hipY + 8 };
            weaponAngleR = f === 1 ? -1.15 : Math.PI + 1.15;
          } else if (this.animState === 'vanish_slam') {
            lean = f * 10;
            chestLean = f * 11;
            handR = { x: bx + f * 16, y: by - 2 };
            elbowR = { x: bx + f * 11, y: hipY };
            weaponAngleR = f === 1 ? 0.95 : Math.PI - 0.95;
          } else if (this.animState === 'attack' && this.activeAttack) {
            const mv = this.activeAttack;
            const phase =
              this.moveFrame < mv.startup
                ? 'windup'
                : this.moveFrame < mv.startup + mv.active
                ? 'active'
                : 'follow';

            if (phase === 'windup') {
              lean = -f * 5;
              chestLean = -f * 4;
              kneeR = { x: bx + f * 3, y: by - 6 };
              kneeL = { x: bx - f * 5, y: by - 6 };
              handR = { x: bx - f * 12, y: neckY + 1 };
              elbowR = { x: bx - f * 7, y: neckY + 2 };
              weaponAngleR = f === 1 ? -1.5 : Math.PI + 1.5;
            } else {
              const pk = mv.poseKey;
              if (pk === 'uppercut') {
                lean = f * 3;
                chestLean = f * 4;
                headTilt = -1;
                handR = { x: bx + f * 7, y: headY - 13 };
                elbowR = { x: bx + f * 6, y: headY - 4 };
                kneeR = { x: bx + f * 6, y: hipY + 2 };
                weaponAngleR = -Math.PI / 2;
              } else if (pk === 'low_sweep' || pk === 'ground_slam') {
                lean = f * 8;
                chestLean = f * 9;
                hipY += 4;
                chestY += 5;
                neckY += 6;
                headY += 6;
                handR = { x: bx + f * 14, y: by - 3 };
                elbowR = { x: bx + f * 9, y: hipY };
                footR = { x: bx + f * 15, y: by };
                weaponAngleR = f === 1 ? 0.85 : Math.PI - 0.85;
              } else if (pk === 'roundhouse' || pk === 'back_kick') {
                const kickDir = pk === 'back_kick' ? -f : f;
                lean = -kickDir * 6;
                chestLean = -kickDir * 5;
                footR = { x: bx + kickDir * 18, y: hipY - 4 };
                kneeR = { x: bx + kickDir * 10, y: hipY - 2 };
                handR = { x: bx - kickDir * 8, y: neckY + 4 };
              } else if (pk === 'dive_spike') {
                lean = f * 4;
                footR = { x: bx + f * 4, y: by + 6 };
                kneeR = { x: bx + f * 3, y: by - 2 };
                handR = { x: bx + f * 8, y: hipY + 4 };
                weaponAngleR = Math.PI / 2;
              } else if (pk === 'haki_stance') {
                lean = 0;
                chestLean = 0;
                handR = { x: bx + f * 4, y: hipY - 2 };
                elbowR = { x: bx - f * 4, y: neckY + 4 };
                weaponAngleR = f === 1 ? -0.2 : Math.PI + 0.2;
              } else {
                lean = f * 9;
                chestLean = f * 10;
                footR = { x: bx + f * 11, y: by };
                footL = { x: bx - f * 8, y: by };
                handR = { x: bx + f * 19, y: neckY + 3 };
                elbowR = { x: bx + f * 11, y: neckY + 3 };
                handL = { x: bx - f * 8, y: neckY + 5 };
                weaponAngleR = f === 1 ? 0.08 : Math.PI - 0.08;
              }
            }
          }

          return {
            facing: f,
            headTilt,
            head: { x: bx + lean * 1.1, y: headY },
            neck: { x: bx + lean * 0.75, y: neckY },
            chest: { x: bx + chestLean * 0.55, y: chestY },
            hip: { x: bx, y: hipY },
            shoulderL: { x: bx + chestLean * 0.65 - f * 2, y: neckY + 2 },
            shoulderR: { x: bx + chestLean * 0.65 + f * 2, y: neckY + 2 },
            kneeL,
            kneeR,
            footL,
            footR,
            elbowL,
            elbowR,
            handL,
            handR,
            weapon: {
              type: this.def.weaponType,
              primaryColor: this.def.primaryColor,
              weaponAngleR,
              weaponAngleL,
              overcharged: this.overcharged,
              astralBlades:
                this.charId === 'soren' && this.astralAnchors.length === 0
                  ? [0, 1, 2].map((idx) => {
                      const a = this.astralOrbitTime + (idx * Math.PI * 2) / 3;
                      return {
                        x: bx - f * 12 + Math.cos(a) * 8,
                        y: neckY - 2 + Math.sin(a) * 11,
                        angle: f === 1 ? -0.2 : Math.PI + 0.2
                      };
                    })
                  : null
            }
          };
        }

        // Safe CPU AI Opponent (Never chases offstage when opponent.state !== 'active')
        computeAIControls(opponent) {
          const res = { axisX: 0, axisY: 0, holdStrong: false, bufferedAction: null };
          if (!opponent) return res;

          const stg = getCurrentStage();
          const diff = gameState.aiDifficulty;
          const reactionInterval = diff === 2 ? 4 : diff === 1 ? 8 : 15;

          this.aiTimer++;

          // 1. Offstage Recovery Priority (always active so CPU never falls to its death)
          const offLeft = this.x < stg.mainLeft - 10;
          const offRight = this.x > stg.mainRight + 10;
          if (offLeft || offRight || this.y > stg.mainFloorY + 12) {
            res.axisX = this.x < 400 ? 1 : -1;
            if (this.vy > 2 && this.jumpsUsed < 2) {
              res.bufferedAction = { action: 'jump', dir: res.axisX > 0 ? 'right' : 'left' };
            } else if (this.y > 260 && this.vy > 1) {
              res.bufferedAction = { action: 'special', dir: 'up' };
            }
            return res;
          }

          // 2. SAFE WAIT BEHAVIOR: When opponent.state !== 'active', recover to center stage (400, 260) and wait
          if (opponent.state !== 'active') {
            this.aiDir = 0;
            const distFromCenter = 400 - this.x;
            if (Math.abs(distFromCenter) > 36) {
              res.axisX = distFromCenter > 0 ? 1 : -1;
            } else {
              this.facing = opponent.x >= this.x ? 1 : -1;
            }
            return res;
          }

          const dx = opponent.x - this.x;
          const dy = opponent.y - this.y;
          const d = Math.hypot(dx, dy);

          // 3. Opportunistic Mid-Air Anime Vanish-Strike
          if (this.canTriggerVanish(opponent) && Math.random() < (diff === 2 ? 0.35 : diff === 1 ? 0.16 : 0.05)) {
            res.bufferedAction = { action: 'strong', dir: dx >= 0 ? 'right' : 'left' };
            return res;
          }

          // 4. Observation Haki Counter for Kage
          if (
            this.charId === 'kage' &&
            opponent.actionState === 'attack' &&
            d < 70 &&
            !this.hakiActive &&
            this.hakiTimer <= 0 &&
            Math.random() < (diff === 2 ? 0.32 : 0.12)
          ) {
            res.bufferedAction = { action: 'special', dir: 'neutral' };
            return res;
          }

          if (this.aiTimer % reactionInterval !== 0) {
            res.axisX = this.aiDir;
            return res;
          }

          // 5. Unique Buffs
          if (d > 110 && this.grounded) {
            if (this.charId === 'kaze' && this.overdriveTimer <= 0 && Math.random() < 0.25) {
              res.bufferedAction = { action: 'special', dir: 'neutral' };
              return res;
            }
            if (this.charId === 'soren' && this.astralAnchors.length === 0 && Math.random() < 0.22) {
              res.bufferedAction = { action: 'special', dir: 'neutral' };
              return res;
            }
          }

          if (this.charId === 'soren' && this.astralAnchors.length > 0) {
            const anc = this.astralAnchors[1];
            if (anc && dist(anc.x, anc.y, opponent.x, opponent.y - 16) < 42) {
              res.bufferedAction = { action: 'special', dir: 'neutral' };
              return res;
            }
          }

          // 6. Spacing & Engagement
          if (d > 48) {
            this.aiDir = dx > 0 ? 1 : -1;
            res.axisX = this.aiDir;
            if (dy < -45 && this.grounded && Math.random() < 0.35) {
              res.bufferedAction = { action: 'jump', dir: 'up' };
            } else if (dy > 45 && this.onPlatform) {
              res.axisY = 1;
              this.dropThroughTimer = 14;
              this.grounded = false;
              this.onPlatform = false;
            }
          } else {
            this.facing = dx >= 0 ? 1 : -1;
            this.aiDir = 0;
            const roll = Math.random();
            if (opponent.damage >= 75 && roll < 0.35) {
              const sDir = dy < -20 ? 'up' : dx >= 0 ? 'right' : 'left';
              res.bufferedAction = { action: 'strong', dir: sDir };
            } else if (roll < 0.55) {
              const lDir = opponent.damage > 30 && Math.random() < 0.4 ? 'up' : 'neutral';
              res.bufferedAction = { action: 'light', dir: lDir };
            } else if (roll < 0.72) {
              res.bufferedAction = { action: 'special', dir: dx >= 0 ? 'right' : 'left' };
            } else if (roll < 0.85 && this.grounded) {
              res.bufferedAction = { action: 'shorthop', dir: 'up' };
            }
          }

          return res;
        }
      }

      // -------------------------------------------------------------------------
      // 11. HIT RESOLUTION & KNOCKBACK SCALING
      // -------------------------------------------------------------------------
      function applyHit(attacker, defender, move, camera) {
        if (!defender || !defender.isTargetable()) return;

        const armored = defender.superArmor;
        const dmg = armored ? Math.ceil(move.damage * 0.5) : move.damage;
        defender.damage = clamp(defender.damage + dmg, 0, 999);
        defender.damageShake = Math.min(12, 4 + dmg * 0.35);

        if (attacker.charId === 'kaze' && attacker.overdriveTimer <= 0) {
          attacker.meter = clamp(attacker.meter + dmg * 1.4, 0, 100);
        }
        if (attacker.charId === 'kage') {
          attacker.meter = clamp(attacker.meter + dmg * 1.3, 0, 100);
        }
        if (attacker.charId === 'raijin' && !attacker.overcharged) {
          attacker.meter = clamp(attacker.meter + dmg * 1.6, 0, 100);
          if (attacker.meter >= 100) {
            attacker.overcharged = true;
            sfx.playLightning();
            vfx.spawnFloatingText(attacker.x, attacker.y - 42, 'REACTOR 100%!', '#facc15');
          }
        }

        const stopFrames = move.hitstop || 6;
        attacker.hitstop = stopFrames;
        defender.hitstop = stopFrames;

        const hitX = (attacker.x + defender.x) * 0.5;
        const hitY = defender.y - 18;
        const launchAngle = attacker.facing === 1 ? move.angle : Math.PI - move.angle;

        vfx.spawnHitSparks(hitX, hitY, launchAngle, attacker.def.primaryColor, move.power * 7 + 6, 0.8 + move.power * 0.25);
        vfx.spawnShockwave(hitX, hitY, 18 + move.power * 12, '#ffffff', move.power >= 3 ? 3 : 2, 12);
        sfx.playHit(move.power || 1);

        if (move.power >= 3 || move.isFinisher || defender.damage >= 110) {
          vfx.triggerImpactFrame(3, attacker.def.primaryColor);
          camera.addShake(9 + move.power * 2.5);
        } else if (move.power === 2) {
          camera.addShake(4.5);
        } else {
          camera.addShake(2.2);
        }

        if (armored) {
          vfx.spawnFloatingText(defender.x, defender.y - 40, 'ARMOR!', '#facc15');
          return;
        }

        const weightFactor = 1 / Math.max(0.5, defender.def.stats.weight);
        const kbMagnitude = (move.baseKb + defender.damage * move.kbScale) * weightFactor;

        defender.vx = Math.cos(launchAngle) * kbMagnitude;
        defender.vy = Math.sin(launchAngle) * kbMagnitude;
        defender.grounded = false;
        defender.onPlatform = false;
        defender.fastFalling = false;
        defender.suspended = false;
        defender.suspendTimer = 0;
        defender.activeAttack = null;
        defender.superArmor = false;
        defender.hitstun = Math.max(10, Math.round(kbMagnitude * 2.95));
        defender.actionState = 'hitstun';
        defender.animState = 'hitstun';
        defender.scaleX = 0.76;
        defender.scaleY = 1.26;
      }

      // -------------------------------------------------------------------------
      // 12. SPRING-DAMPED DYNAMIC CAMERA (TRACKS 'active' | 'respawning' ONLY)
      // -------------------------------------------------------------------------
      class DynamicCamera {
        constructor() {
          this.x = 400;
          this.y = 225;
          this.zoom = 1.04;
          this.shake = 0;
          this.shakeX = 0;
          this.shakeY = 0;
        }

        reset() {
          this.x = 400;
          this.y = 225;
          this.zoom = 1.04;
          this.shake = 0;
          this.shakeX = 0;
          this.shakeY = 0;
        }

        addShake(amount) {
          this.shake = Math.min(20, this.shake + amount);
        }

        update(p1, p2) {
          const p1Tracked = p1 && (p1.state === 'active' || p1.state === 'respawning');
          const p2Tracked = p2 && (p2.state === 'active' || p2.state === 'respawning');

          let targetX = 400;
          let targetY = 225;
          let targetZoom = 1.0;

          if (p1Tracked && p2Tracked) {
            const x1 = clamp(p1.x, 80, 720);
            const y1 = clamp(p1.y - 22, 40, 380);
            const x2 = clamp(p2.x, 80, 720);
            const y2 = clamp(p2.y - 22, 40, 380);

            targetX = (x1 + x2) * 0.5;
            targetY = (y1 + y2) * 0.5;

            const separation = safeHypot(x2 - x1, y2 - y1);
            targetZoom = clamp(1.28 - separation / 620, 0.84, 1.22);

            if (p1.actionState === 'vanish_charge' || p2.actionState === 'vanish_charge') {
              targetZoom = 1.28;
            }
          } else if (p1Tracked) {
            targetX = lerp(400, clamp(p1.x, 160, 640), 0.5);
            targetY = lerp(225, clamp(p1.y - 24, 90, 340), 0.5);
            targetZoom = 1.0;
          } else if (p2Tracked) {
            targetX = lerp(400, clamp(p2.x, 160, 640), 0.5);
            targetY = lerp(225, clamp(p2.y - 24, 90, 340), 0.5);
            targetZoom = 1.0;
          }

          targetX = clamp(targetX, 240, 560);
          targetY = clamp(targetY, 135, 285);
          targetZoom = clamp(targetZoom, 0.82, 1.3);

          this.x = lerp(this.x, targetX, 0.11);
          this.y = lerp(this.y, targetY, 0.11);
          this.zoom = lerp(this.zoom, targetZoom, 0.085);

          if (!Number.isFinite(this.x) || !Number.isFinite(this.y) || !Number.isFinite(this.zoom) || this.zoom <= 0) {
            this.reset();
          }

          if (this.shake > 0.1) {
            this.shakeX = randRange(-this.shake, this.shake);
            this.shakeY = randRange(-this.shake, this.shake);
            this.shake *= 0.82;
          } else {
            this.shake = 0;
            this.shakeX = 0;
            this.shakeY = 0;
          }
        }

        applyTransform(ctx) {
          ctx.translate(INTERNAL_W / 2 + this.shakeX, INTERNAL_H / 2 + this.shakeY);
          ctx.scale(this.zoom, this.zoom);
          ctx.translate(-this.x, -this.y);
        }
      }

      const camera = new DynamicCamera();

      // -------------------------------------------------------------------------
      // 13. GAME STATE & MENU CONTROLS
      // -------------------------------------------------------------------------
      const gameState = {
        matchState: 'title', // 'title' | 'playing' | 'ko_finish' | 'gameover'
        finishTimer: 0,
        paused: false,
        mode: '1P', // '1P' | '2P'
        stageIndex: 0,
        p1Choice: 0,
        p2Choice: 1,
        aiDifficulty: 1,
        p1: null,
        p2: null,
        projectiles: [],
        matchTimer: 0,
        winner: null,
        previewTime: 0
      };

      const DIFF_NAMES = ['CASUAL', 'RIVAL', 'ANIME BOSS'];

      function startMatch() {
        const c1 = CHAR_KEYS[gameState.p1Choice];
        const c2 = CHAR_KEYS[gameState.p2Choice];
        gameState.p1 = new Fighter(0, c1, false);
        gameState.p2 = new Fighter(1, c2, gameState.mode === '1P');
        gameState.projectiles = [];
        gameState.matchTimer = 0;
        gameState.winner = null;
        gameState.paused = false;
        gameState.finishTimer = 0;
        gameState.matchState = 'playing';
        input.clearBuffers(0);
        input.clearBuffers(1);
        vfx.reset();
        camera.reset();
        sfx.playUiSelect();
        sfx.startAtmosphericBed();
      }

      canvas.addEventListener('click', (e) => {
        sfx.init();
        const rect = canvas.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / Math.max(1, rect.width)) * INTERNAL_W;
        const my = ((e.clientY - rect.top) / Math.max(1, rect.height)) * INTERNAL_H;

        if (gameState.matchState === 'title') {
          for (let i = 0; i < 4; i++) {
            const cx = 42 + i * 182;
            const cy = 78;
            if (mx >= cx && mx <= cx + 170 && my >= cy && my <= cy + 162) {
              gameState.p1Choice = i;
              if (gameState.p2Choice === i) gameState.p2Choice = (i + 1) % 4;
              sfx.playUiMove();
            }
          }
          if (mx >= 42 && mx <= 186 && my >= 318 && my <= 346) {
            gameState.mode = gameState.mode === '1P' ? '2P' : '1P';
            sfx.playUiMove();
          }
          if (mx >= 194 && mx <= 372 && my >= 318 && my <= 346) {
            gameState.p2Choice = (gameState.p2Choice + 1) % 4;
            sfx.playUiMove();
          }
          if (mx >= 380 && mx <= 574 && my >= 318 && my <= 346) {
            gameState.stageIndex = (gameState.stageIndex + 1) % STAGES.length;
            sfx.playUiMove();
          }
          if (mx >= 582 && mx <= 758 && my >= 318 && my <= 346) {
            gameState.aiDifficulty = (gameState.aiDifficulty + 1) % 3;
            sfx.playUiMove();
          }
          if (mx >= 555 && mx <= 758 && my >= 354 && my <= 390) {
            startMatch();
          }
        } else if (gameState.matchState === 'gameover') {
          if (mx >= 210 && mx <= 390 && my >= 310 && my <= 348) {
            startMatch();
          }
          if (mx >= 410 && mx <= 590 && my >= 310 && my <= 348) {
            gameState.matchState = 'title';
            sfx.stopAtmosphericBed();
            sfx.playUiSelect();
          }
        } else if ((gameState.matchState === 'playing' || gameState.matchState === 'ko_finish') && gameState.paused) {
          if (mx >= 300 && mx <= 500 && my >= 295 && my <= 327) {
            gameState.paused = false;
            sfx.playUiSelect();
          }
          if (mx >= 300 && mx <= 500 && my >= 337 && my <= 369) {
            gameState.paused = false;
            gameState.matchState = 'title';
            sfx.stopAtmosphericBed();
            sfx.playUiSelect();
          }
        }
      });

      // -------------------------------------------------------------------------
      // 14. STAGE, RESPAWN HALO, & FIGHTER RENDERERS
      // -------------------------------------------------------------------------
      function renderStage(ctx, time) {
        const stg = getCurrentStage();

        const skyGrad = ctx.createLinearGradient(0, -240, 0, 620);
        skyGrad.addColorStop(0, stg.skyTop);
        skyGrad.addColorStop(0.5, stg.skyMid);
        skyGrad.addColorStop(1, stg.skyBot);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(-260, -280, 1320, 960);

        // Ambient radial celestial glow (guarded with strictly positive radii)
        const sunX = stg.id === 'eclipse' ? 560 : 580;
        const sunY = stg.id === 'eclipse' ? 95 : 85;
        const radGrad = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 72);
        radGrad.addColorStop(0, stg.id === 'eclipse' ? 'rgba(244, 63, 94, 0.25)' : 'rgba(125, 211, 252, 0.16)');
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radGrad;
        ctx.fillRect(sunX - 75, sunY - 75, 150, 150);

        if (stg.id === 'eclipse') {
          fillPixelCircle(ctx, 560, 95, 34, '#fb7185');
          fillPixelCircle(ctx, 554, 92, 30, '#180811');
        } else {
          fillPixelCircle(ctx, 580, 85, 28, 'rgba(224, 242, 254, 0.14)');
        }

        // Parallax Pixel Clouds
        for (const c of bgClouds) {
          c.x += c.speed;
          if (c.x > 920) c.x = -120 - c.w;
          const cx = Math.round(c.x);
          const cy = Math.round(c.y);
          ctx.fillStyle = c.layer === 0 ? 'rgba(30, 41, 75, 0.55)' : 'rgba(51, 65, 105, 0.35)';
          ctx.fillRect(cx, cy, c.w, c.h);
          ctx.fillRect(cx + 8, cy - 6, c.w - 16, 6);
        }

        // Distant Floating Ruins
        for (const isl of bgIslands) {
          const bob = Math.sin(time * 0.025 + isl.bobOffset) * 4;
          const ix = Math.round(isl.x);
          const iy = Math.round(isl.y + bob);
          ctx.fillStyle = stg.stoneTop;
          ctx.fillRect(ix, iy, isl.w, Math.floor(isl.h * 0.5));
          ctx.fillRect(ix + 10, iy + Math.floor(isl.h * 0.5), isl.w - 20, Math.floor(isl.h * 0.35));
          ctx.fillStyle = stg.turfBody;
          ctx.fillRect(ix - 2, iy - 3, isl.w + 4, 4);
        }

        // Ambient Motes
        for (const m of ambientMotes) {
          m.x += m.vx;
          m.y += m.vy;
          if (m.y < 10) m.y = 405;
          ctx.save();
          ctx.globalAlpha = m.alpha;
          ctx.fillStyle = stg.id === 'eclipse' ? '#fb7185' : m.color;
          ctx.fillRect(Math.round(m.x), Math.round(m.y), m.size, m.size);
          ctx.restore();
        }

        // Main Floating Sanctuary Island
        const ml = stg.mainLeft;
        const mr = stg.mainRight;
        const mw = mr - ml;
        const my = stg.mainFloorY;

        ctx.fillStyle = stg.stoneTop;
        ctx.fillRect(ml + 4, my + 6, mw - 8, 22);
        ctx.fillStyle = stg.stoneMid;
        ctx.fillRect(ml + 26, my + 28, mw - 52, 20);
        ctx.fillStyle = stg.stoneBot;
        ctx.fillRect(ml + 64, my + 48, mw - 128, 16);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
        for (let bx = ml + 14; bx < mr - 20; bx += 28) {
          ctx.fillRect(bx, my + 10, 22, 8);
          ctx.fillRect(bx + 8, my + 21, 18, 6);
        }

        const pulse = 0.55 + Math.sin(time * 0.06) * 0.25;
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.fillStyle = stg.coreColor;
        ctx.fillRect(386, my + 34, 28, 6);
        ctx.fillRect(394, my + 40, 12, 12);
        ctx.restore();

        ctx.fillStyle = stg.turfBody;
        ctx.fillRect(ml - 2, my, mw + 4, 6);
        ctx.fillStyle = stg.turfTop;
        ctx.fillRect(ml - 2, my, mw + 4, 2);

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(ml - 2, my, 4, 4);
        ctx.fillRect(mr - 2, my, 4, 4);

        // Pass-Through Platforms
        for (const p of stg.platforms) {
          ctx.fillStyle = '#334155';
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(p.x, p.y, p.w, 3);
          ctx.fillStyle = stg.platAccent;
          ctx.fillRect(p.x + 2, p.y, 4, 2);
          ctx.fillRect(p.x + p.w - 6, p.y, 4, 2);
        }
      }

      function renderFighter(ctx, fighter) {
        if (!fighter || fighter.state === 'dead') return;

        // 1. Render per-fighter afterimages behind fighter
        for (const img of fighter.afterimages) {
          const ratio = img.life / Math.max(1, img.maxLife);
          ctx.save();
          ctx.globalAlpha = img.alpha * ratio;
          renderStickSkeleton(ctx, img.joints, img.clothChains, img.color, img.color, img.color, null, true);
          ctx.restore();
        }

        // 2. If fighter.state === 'respawning', render glowing pixel respawn platform/halo right under fighter at (fighter.x, fighter.y + 22)
        if (fighter.state === 'respawning') {
          const hx = Math.round(fighter.x);
          const hy = Math.round(fighter.y + 22);
          ctx.save();
          ctx.fillStyle = fighter.def.primaryColor;
          ctx.fillRect(hx - 24, hy, 48, 4);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(hx - 16, hy + 1, 32, 2);
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = fighter.def.primaryColor;
          ctx.fillRect(hx - 14, hy + 4, 28, 12);
          ctx.restore();
        }

        ctx.save();

        // Invulnerability shimmer
        if (fighter.invulnTimer > 0 && Math.floor(fighter.invulnTimer / 3) % 2 === 0) {
          ctx.globalAlpha = 0.55;
        }

        if (fighter.grounded) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
          ctx.fillRect(Math.round(fighter.x) - 10, Math.round(fighter.y) - 1, 20, 3);
        }

        if (fighter.charId === 'kaze' && fighter.overdriveTimer > 0) {
          strokePixelCircle(
            ctx,
            fighter.x,
            fighter.y - 18,
            20 + Math.sin(fighter.animTime * 3) * 2,
            'rgba(56, 189, 248, 0.55)',
            1
          );
        }

        if (fighter.charId === 'kage' && (fighter.hakiActive || fighter.hakiTimer > 0 || fighter.meter >= 100)) {
          const r = fighter.hakiActive || fighter.hakiTimer > 0 ? 22 : 16;
          strokePixelCircle(
            ctx,
            fighter.x,
            fighter.y - 19,
            r + Math.sin(fighter.animTime * 2) * 2,
            fighter.hakiActive || fighter.hakiTimer > 0 ? '#ff2a55' : 'rgba(244, 63, 94, 0.45)',
            1
          );
        }

        if (fighter.charId === 'raijin' && fighter.overcharged) {
          strokePixelCircle(
            ctx,
            fighter.x,
            fighter.y - 18,
            21 + Math.cos(fighter.animTime * 3) * 2,
            '#facc15',
            1
          );
        }

        if (fighter.chargeFrames > 0) {
          const cr = 16 + (fighter.chargeFrames / 85) * 14;
          strokePixelCircle(ctx, fighter.x, fighter.y - 18, cr, fighter.def.primaryColor, 2);
        }

        if (fighter.charId === 'soren' && fighter.astralAnchors.length > 0) {
          for (const anc of fighter.astralAnchors) {
            const bx1 = anc.x - Math.cos(anc.angle) * 10;
            const by1 = anc.y - Math.sin(anc.angle) * 10;
            const bx2 = anc.x + Math.cos(anc.angle) * 10;
            const by2 = anc.y + Math.sin(anc.angle) * 10;
            drawPixelLimb(ctx, bx1, by1, bx2, by2, 3, '#c084fc');
            strokePixelCircle(ctx, anc.x, anc.y, 12, 'rgba(232, 121, 249, 0.45)', 1);
          }
        }

        renderStickSkeleton(
          ctx,
          fighter.joints,
          fighter.clothChains,
          fighter.def.secondaryColor,
          fighter.def.eyeColor,
          fighter.def.wrapColor,
          fighter.joints.weapon,
          false
        );

        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        const tag = fighter.slot === 0 ? 'P1' : gameState.mode === '2P' ? 'P2' : 'CPU';
        const tagY = Math.round(fighter.y - 44);
        ctx.fillStyle = fighter.slot === 0 ? '#38bdf8' : '#f43f5e';
        ctx.fillText(tag, Math.round(fighter.x), tagY);

        ctx.restore();

      function renderProjectiles(ctx, projectiles) {
        for (const p of projectiles) {
          ctx.save();
          if (p.type === 'crescent') {
            const dir = p.vx >= 0 ? 1 : -1;
            const start = dir === 1 ? -0.9 : Math.PI - 0.9;
            const end = dir === 1 ? 0.9 : Math.PI + 0.9;
            for (let i = 0; i < 14; i++) {
              const t = i / 14;
              const a = lerp(start, end, t);
              const px = Math.round(p.x + Math.cos(a) * p.r);
              const py = Math.round(p.y + Math.sin(a) * (p.r * 1.4));
              ctx.fillStyle = i % 2 === 0 ? p.color : '#ffffff';
              ctx.fillRect(px - 2, py - 2, 4, 4);
            }
          } else if (p.type === 'bolt') {
            drawPixelLimb(ctx, p.x - p.vx * 1.5, p.y, p.x + p.vx * 0.5, p.y, 5, p.color);
            drawPixelLimb(ctx, p.x - p.vx * 1.2, p.y, p.x + p.vx * 0.4, p.y, 2, '#ffffff');
            strokePixelCircle(ctx, p.x, p.y, 11, '#fef08a', 1);
          } else {
            drawPixelLimb(ctx, p.x - p.vx, p.y, p.x + p.vx * 0.6, p.y, 3, p.color);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(Math.round(p.x), Math.round(p.y) - 1, 4, 2);
          }
          ctx.restore();
        }
      }

      function drawPlayerCard(ctx, fighter, x, y, label) {
        const w = 180;

        ctx.fillStyle = 'rgba(10, 15, 28, 0.85)';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = fighter.def.primaryColor;
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, h);

        ctx.fillRect(x, y, w, 3);

        ctx.fillText(label, x + 10, y + 27);

          const sx = x + 14 + s * 13;
          const sy = y + 37;
          if (s < fighter.stocks) {
            fillPixelCircle(ctx, sx, sy, 4, fighter.def.primaryColor);
            fillPixelCircle(ctx, sx - 1, sy - 1, 1, '#ffffff');
          } else {
            strokePixelCircle(ctx, sx, sy, 3, '#334155', 1);
          }
        }

        const dmg = Math.floor(fighter.damage);
        let dmgColor = '#f8fafc';
        if (dmg >= 120) dmgColor = '#ef4444';
        else if (dmg >= 75) dmgColor = '#f97316';
        else if (dmg >= 35) dmgColor = '#facc15';

        const shakeX = fighter.damageShake > 0.2 ? randRange(-fighter.damageShake, fighter.damageShake) : 0;

        ctx.fillText(`${dmg}%`, x + w - 10 + shakeX, y + 32 + shakeY);

      let lastTime = performance.now();

      function updateMenuInputs() {
        if (gameState.matchState === 'title') {
          if (input.justPressed['KeyA'] || input.justPressed['ArrowLeft']) {
            gameState.p1Choice = (gameState.p1Choice + 3) % 4;
            if (gameState.p2Choice === gameState.p1Choice) gameState.p2Choice = (gameState.p1Choice + 1) % 4;
            sfx.playUiMove();
          }
          if (input.justPressed['KeyD'] || input.justPressed['ArrowRight']) {
            gameState.p1Choice = (gameState.p1Choice + 1) % 4;
            if (gameState.p2Choice === gameState.p1Choice) gameState.p2Choice = (gameState.p1Choice + 1) % 4;
            sfx.playUiMove();
          }
          if (input.justPressed['KeyQ']) {
            gameState.p2Choice = (gameState.p2Choice + 1) % 4;
            sfx.playUiMove();
          }
          if (input.justPressed['KeyT']) {
            gameState.stageIndex = (gameState.stageIndex + 1) % STAGES.length;
            sfx.playUiMove();
          }
          if (input.justPressed['KeyV']) {
            gameState.mode = gameState.mode === '1P' ? '2P' : '1P';
            sfx.playUiMove();
          }
          if (input.justPressed['KeyE']) {
            gameState.aiDifficulty = (gameState.aiDifficulty + 1) % 3;
            sfx.playUiMove();
          }
          if (input.justPressed['Enter'] || input.justPressed['Space']) {
            startMatch();
          }
        } else if (gameState.matchState === 'playing' || gameState.matchState === 'ko_finish') {
          if (input.justPressed['Escape'] || input.justPressed['KeyP']) {
            gameState.paused = !gameState.paused;
            sfx.playUiSelect();
          }
        } else if (gameState.matchState === 'gameover') {
          if (input.justPressed['Enter'] || input.justPressed['Space']) {
            startMatch();
          } else if (input.justPressed['Escape']) {
            gameState.matchState = 'title';
            sfx.stopAtmosphericBed();
            sfx.playUiSelect();
          }
        }
      }

      function updateBattleStep() {
        if (gameState.paused) return;

        // Handle dramatic 'ko_finish' countdown before 'gameover'
        if (gameState.matchState === 'ko_finish') {
          gameState.finishTimer--;
          vfx.update();
          camera.update(gameState.p1, gameState.p2);
          if (gameState.finishTimer <= 0) {
            gameState.matchState = 'gameover';
            sfx.stopAtmosphericBed();
          }
          return;
        }

        // Time-dilation slow-motion (never runs while a fighter is dead/respawning)
        const bothActive =
          gameState.p1 &&
          gameState.p2 &&
          gameState.p1.state === 'active' &&
          gameState.p2.state === 'active';

        if (vfx.timeDilation < 1.0 && bothActive) {
          slowMoStep += vfx.timeDilation;
          if (slowMoStep < 1.0) {
            vfx.update();
            return;
          }
          slowMoStep -= 1.0;
        } else if (!bothActive && vfx.timeDilation < 1.0) {
          vfx.clearTimeDilation();
          slowMoStep = 0;
        }

        gameState.matchTimer++;

        const p1 = gameState.p1;
        const p2 = gameState.p2;

        p1.update(p2, gameState.projectiles, camera);
        p2.update(p1, gameState.projectiles, camera);

        // Update Projectiles
        for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
          const pr = gameState.projectiles[i];
          pr.x += pr.vx;
          pr.y += pr.vy;
          pr.life--;

          const target = pr.owner === p1 ? p2 : p1;
          if (target && target.isTargetable() && dist(pr.x, pr.y, target.x, target.y - 18) <= pr.r + 12) {
            if (target.charId === 'kage' && (target.hakiActive || target.hakiTimer > 0 || target.meter >= 100)) {
              target.triggerObservationHakiCounter(pr.owner);
            } else {
              applyHit(
                pr.owner,
                target,
                {
                  damage: pr.damage,
                  baseKb: pr.baseKb,
                  kbScale: pr.kbScale,
                  angle: pr.angle,
                  hitstop: 6,
                  power: 2
                },
                camera
              );
            }
            gameState.projectiles.splice(i, 1);
            continue;
          }

          if (pr.life <= 0) {
            gameState.projectiles.splice(i, 1);
          }
        }

        // Strict Blast-Zone KO Detection (only runs when fighter.state === 'active')
        checkBlastZones(p1);
        checkBlastZones(p2);

        vfx.update();
        camera.update(p1, p2);
      }

      function renderFrame() {
        ctx.imageSmoothingEnabled = false;

        if (gameState.matchState === 'title') {
          renderTitleScreen(ctx);
          return;
        }

        ctx.save();
        camera.applyTransform(ctx);
        renderStage(ctx, gameState.matchTimer);
        renderProjectiles(ctx, gameState.projectiles);
        if (gameState.p1) renderFighter(ctx, gameState.p1);
        if (gameState.p2) renderFighter(ctx, gameState.p2);
        vfx.renderFront(ctx);
        ctx.restore();

        // Anime Impact Frame Flash Overlay
        if (vfx.impactFrames > 0) {
          ctx.save();
          ctx.globalAlpha = 0.34;
          ctx.fillStyle = vfx.impactColor;
          ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          for (let i = 0; i < 24; i++) {
            const ang = (i / 24) * Math.PI * 2;
            const r1 = 230 + (i % 3) * 25;
            const r2 = 460;
            ctx.beginPath();
            ctx.moveTo(INTERNAL_W / 2 + Math.cos(ang) * r1, INTERNAL_H / 2 + Math.sin(ang) * r1);
            ctx.lineTo(INTERNAL_W / 2 + Math.cos(ang) * r2, INTERNAL_H / 2 + Math.sin(ang) * r2);
            ctx.stroke();
          }
          ctx.restore();
        }

        renderBattleHUD(ctx);

        if (gameState.paused) {
          renderPauseOverlay(ctx);
        } else if (gameState.matchState === 'gameover') {
          renderGameOverScreen(ctx);
        }
      }

      function gameLoop(now) {
        const dt = Math.min(100, now - lastTime);
        lastTime = now;
        accumulator += dt;

        while (accumulator >= FIXED_DT) {
          updateMenuInputs();
          input.update();
          if (gameState.matchState === 'playing' || gameState.matchState === 'ko_finish') {
            updateBattleStep();
          }
          input.clearFrameFlags();
          accumulator -= FIXED_DT;
        }

        renderFrame();
        requestAnimationFrame(gameLoop);
      }

      window.onload = () => {
        resizeCanvas();
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
</body>
</html>
